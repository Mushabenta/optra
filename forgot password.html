<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>Forgot Password · Optra</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --dark-blue: #1a365d;
        --dark-blue-light: #2a4a7f;
        --dark-blue-bg: #ebf0f7;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        --text-dark: #000000;
        --text-gray: #6b7280;
        --success: #10b981;
        --error: #ef4444;
        --link-blue: #118ab2;
        --link-blue-hover: #0d6e8f;
        --transition-smooth: all 0.2s ease;
        --radius-xl: 28px;
        --radius-lg: 16px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background: #ffffff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER ===== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link:hover {
        color: var(--dark-blue);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: #9ca3af;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: var(--dark-blue);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition-smooth);
        background: var(--card-bg);
        flex-shrink: 0;
        position: relative;
      }
      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--dark-blue);
      }
      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }

      /* ===== SCROLLABLE CONTENT ===== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 60px;
        -webkit-overflow-scrolling: touch;
      }

      .container {
        max-width: 500px;
        margin: 16px auto 20px;
        padding: 0 15px;
        width: 100%;
      }

      /* ===== FORM CARD ===== */
      .form-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-xl);
        padding: 24px 20px;
        box-shadow: var(--card-shadow);
      }

      @media (max-width: 480px) {
        .form-card {
          padding: 16px 12px;
        }
      }

      .subtitle {
        color: #000000;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 20px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 14px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        transition: var(--transition-smooth);
        background: white;
        color: #000000;
        outline: none;
      }

      input:focus {
        border-color: var(--dark-blue);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
      }

      input::placeholder {
        color: #9ca3af;
      }

      /* Buttons - shorter and cleaner */
      .btn {
        width: auto;
        min-width: 180px;
        padding: 10px 24px;
        background: var(--dark-blue);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
        margin: 14px 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn:hover {
        background: var(--dark-blue-light);
        transform: translateY(-2px);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn i {
        font-size: 14px;
      }

      .btn-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .btn-back {
        background: #f3f4f6;
        color: var(--text-gray);
        box-shadow: none;
        border: 1px solid var(--card-border);
        margin-top: 4px;
        min-width: 120px;
        padding: 8px 20px;
      }

      .btn-back:hover {
        background: #e5e7eb;
        transform: translateY(-2px);
      }

      /* Links - BLUE */
      .links {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }

      .links a {
        color: var(--link-blue);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: var(--transition-smooth);
      }

      .links a:hover {
        color: var(--link-blue-hover);
        text-decoration: underline;
      }

      /* Message */
      .message {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        display: none;
        text-align: center;
      }

      .message.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
        border-left: 4px solid var(--success);
      }

      .message.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
        border-left: 4px solid var(--error);
      }

      .message.info {
        background: #dbeafe;
        color: #1e40af;
        display: block;
        border-left: 4px solid var(--link-blue);
      }

      /* Requirements */
      .req-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #000000;
        margin-bottom: 4px;
      }

      .req-item i {
        font-size: 12px;
        width: 16px;
      }

      .req-item.valid i {
        color: var(--success);
      }

      .req-box {
        background: var(--dark-blue-bg);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        margin-bottom: 16px;
        border: 1px solid var(--card-border);
      }

      .req-box p {
        font-size: 12px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 6px;
      }

      /* ===== FOOTER ===== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 8px 0 10px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 400px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition-smooth);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition-smooth);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition-smooth);
      }

      .nav-item:hover {
        color: var(--dark-blue);
        transform: translateY(-3px);
        background: var(--dark-blue-bg);
      }

      .nav-item:hover i {
        color: var(--dark-blue);
        transform: scale(1.15);
      }

      .nav-item:hover span {
        color: var(--dark-blue);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
          max-width: 100%;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      @media print {
        .main-header,
        .main-footer {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Forgot Password</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scrollable-content">
      <div class="container">
        <div class="form-card">
          <!-- Step 1: Email Form -->
          <div id="step1">
            <div class="subtitle">
              Enter your email address and we'll send you instructions to reset
              your password.
            </div>
            <div class="form-group">
              <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
              />
            </div>
            <div class="btn-wrapper">
              <button class="btn" id="sendResetBtn" onclick="sendResetCode()">
                <i class="fas fa-paper-plane"></i> Send Code
              </button>
            </div>
          </div>

          <!-- Step 2: Reset Code Form -->
          <div id="step2" style="display: none">
            <div class="subtitle">
              We've sent a 6-digit code to
              <span
                id="userEmailDisplay"
                style="font-weight: 600; color: var(--dark-blue)"
              ></span>
            </div>

            <div class="form-group">
              <input
                type="text"
                id="resetCode"
                placeholder="Enter 6-digit code"
                maxlength="6"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
              />
            </div>

            <div class="req-box">
              <p>Password must:</p>
              <div class="req-item" id="reqLength">
                <i class="fas fa-circle"></i>
                <span>Be at least 8 characters</span>
              </div>
              <div class="req-item" id="reqMatch">
                <i class="fas fa-circle"></i>
                <span>Match confirmation password</span>
              </div>
            </div>

            <div class="btn-wrapper">
              <button
                class="btn"
                id="resetPasswordBtn"
                onclick="resetPassword()"
              >
                <i class="fas fa-key"></i> Reset
              </button>
            </div>
            <div class="btn-wrapper">
              <button class="btn btn-back" onclick="backToEmail()">
                <i class="fas fa-arrow-left"></i> Back
              </button>
            </div>
          </div>

          <div id="message" class="message"></div>

          <div class="links">
            <a href="index.html">Back to Login</a>
            <a href="register.html">Create New Account</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="profit report.html" class="nav-item"
          ><i class="fas fa-chart-line"></i><span>Profit</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>
    </footer>

    <script>
      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const nameParts = name.trim().split(" ");
        let initials =
          nameParts.length >= 2
            ? (nameParts[0].charAt(0) + nameParts[1].charAt(0)).toUpperCase()
            : nameParts[0].charAt(0).toUpperCase();
        if (!initials) initials = "U";

        let hasImage = false,
          imageSrc = null;
        if (user.profileImage) {
          imageSrc = user.profileImage;
          hasImage = true;
        }
        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--card-bg)";
          initialsSpan.style.color = "#000000";
        }
      }

      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");
        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          return null;
        }
        try {
          const user = JSON.parse(currentUser);
          loadUserAvatar();
          return user;
        } catch (error) {
          return null;
        }
      }

      const step1 = document.getElementById("step1");
      const step2 = document.getElementById("step2");
      const emailInput = document.getElementById("email");
      const userEmailDisplay = document.getElementById("userEmailDisplay");
      const resetCodeInput = document.getElementById("resetCode");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const messageDiv = document.getElementById("message");
      const reqLength = document.getElementById("reqLength");
      const reqMatch = document.getElementById("reqMatch");

      let targetIdentifier = null;

      function showMessage(text, type = "error") {
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        clearTimeout(messageDiv._timeout);
        messageDiv._timeout = setTimeout(() => {
          messageDiv.style.display = "none";
          messageDiv.className = "message";
        }, 5000);
      }

      function validateEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      window.sendResetCode = async function () {
        const email = emailInput.value.trim();

        if (!email) {
          showMessage("Please enter your email address.", "error");
          return;
        }

        if (!validateEmail(email)) {
          showMessage("Please enter a valid email address.", "error");
          return;
        }

        const sendResetBtn = document.getElementById("sendResetBtn");

        try {
          sendResetBtn.disabled = true;
          sendResetBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Sending...';

          const data = await Optra.resetRequest(email);

          targetIdentifier = email;

          userEmailDisplay.textContent = email;
          step1.style.display = "none";
          step2.style.display = "block";

          showMessage(
            data.message ||
              `If an account matches ${email}, a reset code has been sent. Check your inbox.`,
            "info",
          );
        } catch (error) {
          const msg =
            (error.data && error.data.error) ||
            error.message ||
            "An error occurred. Please try again.";
          showMessage(msg, "error");
        } finally {
          sendResetBtn.disabled = false;
          sendResetBtn.innerHTML =
            '<i class="fas fa-paper-plane"></i> Send Code';
        }
      };

      function validatePassword() {
        const newPass = newPasswordInput.value;
        const confirmPass = confirmPasswordInput.value;
        let isValid = true;

        if (newPass.length >= 8) {
          reqLength.innerHTML =
            '<i class="fas fa-check-circle" style="color: var(--success);"></i> <span>Be at least 8 characters</span>';
        } else {
          reqLength.innerHTML =
            '<i class="fas fa-circle"></i> <span>Be at least 8 characters</span>';
          isValid = false;
        }

        if (newPass === confirmPass && newPass.length > 0) {
          reqMatch.innerHTML =
            '<i class="fas fa-check-circle" style="color: var(--success);"></i> <span>Match confirmation password</span>';
        } else {
          reqMatch.innerHTML =
            '<i class="fas fa-circle"></i> <span>Match confirmation password</span>';
          isValid = false;
        }

        return isValid;
      }

      window.resetPassword = async function () {
        const resetCode = resetCodeInput.value.trim();
        const newPass = newPasswordInput.value.trim();
        const confirmPass = confirmPasswordInput.value.trim();

        if (!resetCode) {
          showMessage("Please enter the verification code.", "error");
          return;
        }

        if (resetCode.length !== 6 || isNaN(resetCode)) {
          showMessage("Please enter a valid 6-digit code.", "error");
          return;
        }

        if (!newPass || !confirmPass) {
          showMessage("Please enter new password.", "error");
          return;
        }

        if (newPass.length < 6) {
          showMessage("Password must be at least 8 characters.", "error");
          return;
        }

        if (newPass !== confirmPass) {
          showMessage("Passwords do not match.", "error");
          return;
        }

        if (!targetIdentifier) {
          showMessage("Please request a reset code first.", "error");
          return;
        }

        const resetPasswordBtn = document.getElementById("resetPasswordBtn");
        resetPasswordBtn.disabled = true;
        resetPasswordBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
          await Optra.resetConfirm({
            identifier: targetIdentifier,
            code: resetCode,
            newPassword: newPass,
          });

          showMessage(
            "Password reset successfully! Redirecting to login...",
            "success",
          );

          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);
        } catch (error) {
          const msg =
            (error.data && error.data.error) ||
            error.message ||
            "An error occurred. Please try again.";
          showMessage(msg, "error");
          resetPasswordBtn.disabled = false;
          resetPasswordBtn.innerHTML = '<i class="fas fa-key"></i> Reset';
        }
      };

      window.backToEmail = function () {
        step2.style.display = "none";
        step1.style.display = "block";
        resetCodeInput.value = "";
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
        messageDiv.style.display = "none";
        messageDiv.className = "message";

        reqLength.innerHTML =
          '<i class="fas fa-circle"></i> <span>Be at least 8 characters</span>';
        reqMatch.innerHTML =
          '<i class="fas fa-circle"></i> <span>Match confirmation password</span>';
      };

      newPasswordInput.addEventListener("input", validatePassword);
      confirmPasswordInput.addEventListener("input", validatePassword);

      document.addEventListener("DOMContentLoaded", () => {
        const user = checkAuth();
        if (user) {
          if (user.email) emailInput.value = user.email;
        }
      });
    </script><script src="api-config.js"></script>
    <script src="api.js"></script>
  </body>
</html>
