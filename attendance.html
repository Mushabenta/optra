<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>Attendance Tracker · Optra</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
      :root {
        --icon-gray: #9ca3af;
        --icon-gray-light: #d1d5db;
        --primary-grey: #6b7280;
        --light-grey: #e5e7eb;
        --bg-grey: #f3f4f6;
        --bg-white: #ffffff;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
        --text-dark: #1f2937;
        --text-mid: #4b5563;
        --text-light: #6b7280;
        --radius-xl: 24px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
        --transition: all 0.2s ease;

        --accent: #1a365d;
        --accent-light: #2a4a7f;
        --accent-bg: #ebf0f7;
        --coral: #ef476f;
        --electric-blue: #118ab2;
        --sky-blue: #06d6a0;
        --lilac: #9d4edd;
        --sunshine: #ffd166;
        --success: #06d6a0;
        --error: #ef476f;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      }

      body {
        background: var(--bg-white);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ====== HEADER ====== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link i {
        color: #000000;
      }
      .hamburger-link:hover {
        color: var(--accent);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: var(--icon-gray);
        transition: var(--transition);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn i {
        color: var(--icon-gray);
      }

      .icon-btn:hover {
        color: var(--accent);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition);
        background: var(--bg-white);
        flex-shrink: 0;
        position: relative;
      }

      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--accent);
      }

      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-white);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }
      @media (min-width: 601px) and (max-width: 1024px) {
        .hamburger-link {
          font-size: 24px;
        }
        .page-title {
          font-size: 19px;
        }
        .avatar-btn {
          width: 46px;
          height: 46px;
        }
        .avatar-initials {
          font-size: 17px;
        }
        .icon-btn {
          font-size: 21px;
        }
      }
      @media (min-width: 1025px) {
        .hamburger-link {
          font-size: 28px;
        }
        .page-title {
          font-size: 22px;
        }
        .avatar-btn {
          width: 48px;
          height: 48px;
        }
        .avatar-initials {
          font-size: 18px;
        }
        .icon-btn {
          font-size: 24px;
        }
      }

      /* ====== SCROLLABLE CONTENT ====== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px;
      }

      .container {
        max-width: 1000px;
        margin: 20px auto 30px;
        padding: 0 15px;
        width: 100%;
      }

      /* ====== ATTENDANCE CARD ====== */
      .attendance-card {
        background: var(--card-bg);
        border-radius: var(--radius-xl);
        padding: 25px 20px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        margin-bottom: 30px;
      }

      .attendance-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--accent);
      }

      .attendance-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 25px 40px -16px rgba(0, 0, 0, 0.12);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--card-border);
      }

      .card-header h2 {
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 700;
        color: #000000;
      }

      /* ====== SEARCH SECTION ====== */
      .search-section {
        background: var(--accent-bg);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 20px;
        border-left: 4px solid var(--accent);
      }

      .search-row {
        display: flex;
        align-items: flex-end;
        gap: 0;
        flex-wrap: nowrap;
      }

      .search-row .form-group {
        flex: 1;
        min-width: 0;
        position: relative;
      }

      .search-row .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 4px;
        display: block;
      }

      .search-row .input-wrapper {
        position: relative;
        width: 100%;
      }

      .search-row select {
        width: 100%;
        padding: 10px 44px 10px 14px;
        font-size: 14px;
        border: 2px solid var(--card-border);
        border-radius: var(--radius-sm);
        transition: var(--transition);
        background: white;
        cursor: pointer;
        color: var(--text-dark);
        appearance: none;
        -webkit-appearance: none;
      }

      .search-row select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
      }

      .search-icon-btn {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--icon-gray);
        transition: var(--transition);
        z-index: 5;
      }

      .search-icon-btn svg {
        width: 20px;
        height: 20px;
        fill: var(--icon-gray);
        transition: var(--transition);
        display: block;
      }

      .search-icon-btn:hover svg {
        fill: var(--accent);
      }

      /* ====== FORM SECTION ====== */
      .form-section {
        background: #ffffff;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 20px;
        margin-bottom: 25px;
      }

      .form-row {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .form-group {
        flex: 1;
        min-width: 160px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 4px;
        display: block;
      }

      .form-group select {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        border: 2px solid var(--card-border);
        border-radius: var(--radius-sm);
        transition: var(--transition);
        background: white;
        cursor: pointer;
        color: var(--text-dark);
      }

      .form-group select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
      }

      .action-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .action-btn {
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        white-space: nowrap;
        height: 40px;
      }

      .action-btn i {
        font-weight: 400 !important;
        font-size: 13px;
      }

      .action-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: left 0.7s;
      }

      .action-btn:hover::before {
        left: 100%;
      }

      .action-btn:hover {
        transform: translateY(-2px);
      }

      .btn-add {
        background: var(--accent);
        color: white;
        box-shadow: 0 4px 10px rgba(26, 54, 93, 0.25);
      }
      .btn-add:hover {
        background: var(--accent-light);
      }

      .btn-excel {
        background: #2e7d32;
        color: white;
        box-shadow: 0 4px 10px rgba(46, 125, 50, 0.25);
      }
      .btn-excel:hover {
        background: #1b5e20;
      }

      .btn-pdf {
        background: #d32f2f;
        color: white;
        box-shadow: 0 4px 10px rgba(211, 47, 47, 0.25);
      }
      .btn-pdf:hover {
        background: #b71c1c;
      }

      /* Status Badges */
      .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
      }

      .status-present {
        background: var(--accent);
        color: white;
      }

      .status-late {
        background: var(--sunshine);
        color: var(--text-dark);
      }

      .status-absent {
        background: var(--error);
        color: white;
      }

      /* ====== TABLE STYLES ====== */
      .table-container {
        overflow-x: auto;
        border-radius: var(--radius-sm);
        background: white;
        border: 1px solid var(--card-border);
        margin-top: 20px;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 500px;
      }

      th {
        background: var(--accent);
        color: white;
        padding: 12px 10px;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
      }

      td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--card-border);
        color: var(--text-dark);
        font-size: 14px;
      }

      tr:hover {
        background: var(--accent-bg);
      }

      .delete-btn {
        background: none;
        border: none;
        color: var(--error);
        font-size: 18px;
        cursor: pointer;
        padding: 5px 10px;
        transition: var(--transition);
      }

      .delete-btn i {
        font-weight: 400 !important;
      }

      .delete-btn:hover {
        color: #ff5252;
        transform: scale(1.15);
      }

      /* Info Message - NO ICON */
      .info-message {
        text-align: center;
        padding: 40px;
        color: #000000;
        font-size: 15px;
        background: var(--bg-grey);
        border-radius: var(--radius-lg);
        margin-top: 20px;
        border: 1px solid var(--card-border);
      }

      .info-message p {
        color: #000000;
      }

      /* ====== FOOTER ====== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 10px 0 12px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition);
      }

      .nav-item:hover {
        color: var(--accent);
        transform: translateY(-3px);
        background: var(--accent-bg);
      }

      .nav-item:hover i {
        color: var(--accent);
        transform: scale(1.15);
      }

      .nav-item:hover span {
        color: var(--accent);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      /* ====== RESPONSIVE ====== */
      @media (min-width: 600px) {
        .main-header {
          padding: 8px 24px;
        }
        .container {
          margin: 30px auto 40px;
          padding: 0 20px;
        }
        .attendance-card {
          padding: 30px;
        }
        .form-row {
          flex-wrap: wrap;
        }
      }

      @media (min-width: 900px) {
        .attendance-card {
          padding: 35px;
        }
        .card-header {
          gap: 15px;
          margin-bottom: 30px;
          padding-bottom: 20px;
        }
        .form-group select {
          padding: 12px 16px;
          font-size: 14px;
        }
        th {
          padding: 15px 12px;
          font-size: 14px;
        }
        td {
          padding: 15px 12px;
          font-size: 14px;
        }
      }

      @media (max-width: 768px) {
        .form-row {
          flex-direction: column;
          align-items: stretch;
        }
        .form-group {
          width: 100%;
        }
        .action-buttons {
          justify-content: center;
        }
        .search-row {
          flex-wrap: nowrap;
          align-items: flex-end;
        }
        .search-row .form-group {
          flex: 1;
          min-width: 0;
        }
        .search-icon-btn svg {
          width: 18px;
          height: 18px;
        }
        .search-row select {
          padding: 10px 40px 10px 14px;
        }
      }

      /* ====== SMALL SCREEN - BUTTONS IN ONE ROW ====== */
      @media (max-width: 600px) {
        .action-buttons {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          gap: 6px;
        }
        .action-btn {
          padding: 6px 10px;
          font-size: 11px;
          height: 34px;
          flex: 1 1 auto;
          min-width: 60px;
          max-width: 120px;
        }
        .action-btn i {
          font-size: 12px;
        }
        .form-section {
          padding: 12px;
        }
      }

      @media (max-width: 480px) {
        .action-buttons {
          gap: 4px;
        }
        .action-btn {
          padding: 5px 8px;
          font-size: 10px;
          height: 30px;
          min-width: 50px;
          max-width: 90px;
        }
        .action-btn i {
          font-size: 10px;
        }
      }

      @media (max-width: 380px) {
        .action-btn {
          padding: 4px 6px;
          font-size: 9px;
          height: 28px;
          min-width: 40px;
          max-width: 75px;
        }
        .action-btn i {
          font-size: 9px;
        }
      }

      @media (max-width: 500px) {
        .search-row {
          flex-wrap: nowrap;
        }
        .search-row .form-group {
          min-width: 0;
          flex: 1;
        }
        .search-row select {
          font-size: 13px;
          padding: 8px 36px 8px 10px;
        }
        .search-row .form-group label {
          font-size: 12px;
        }
        .search-icon-btn {
          right: 10px;
        }
        .search-icon-btn svg {
          width: 16px;
          height: 16px;
        }
      }

      @media (max-width: 480px) {
        .main-header {
          padding: 6px 12px;
        }
        .attendance-card {
          padding: 18px 14px;
        }
        .card-header {
          flex-direction: column;
          text-align: center;
          gap: 10px;
        }
        .card-header h2 {
          font-size: 20px;
        }
        .form-section {
          padding: 12px;
        }
        .search-section {
          padding: 15px;
        }
        .search-icon-btn {
          right: 10px;
        }
        .search-icon-btn svg {
          width: 16px;
          height: 16px;
        }
        .search-row select {
          padding: 8px 34px 8px 10px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Attendance Tracker</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- Scrollable Content -->
    <div class="scrollable-content">
      <div class="container">
        <div class="attendance-card">
          <div class="card-header">
            <h2>Staff Attendance</h2>
          </div>

          <!-- Search Section -->
          <div class="search-section">
            <div class="search-row">
              <div class="form-group">
                <label>Search Employee</label>
                <div class="input-wrapper">
                  <select id="searchEmployee">
                    <option value="">Select Employee</option>
                  </select>
                  <button
                    class="search-icon-btn"
                    onclick="searchAttendance()"
                    title="Search"
                  >
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Add Attendance Section -->
          <div class="form-section">
            <div class="form-row">
              <div class="form-group">
                <label>Employee</label>
                <select id="addEmployee">
                  <option value="">Select Employee</option>
                </select>
              </div>

              <div class="form-group">
                <label>Status</label>
                <select id="status">
                  <option value="">Select Status</option>
                  <option value="Present">Present</option>
                  <option value="Late">Late</option>
                  <option value="Absent">Absent</option>
                </select>
              </div>

              <div class="action-buttons">
                <button
                  class="action-btn btn-add"
                  onclick="addOrEditAttendance()"
                  title="Add/Update Attendance"
                >
                  <i class="fas fa-plus"></i> Add
                </button>
                <button
                  class="action-btn btn-excel"
                  onclick="downloadExcel()"
                  title="Download Excel"
                >
                  <i class="fas fa-file-excel"></i> Excel
                </button>
                <button
                  class="action-btn btn-pdf"
                  onclick="downloadPDF()"
                  title="Download PDF"
                >
                  <i class="fas fa-file-pdf"></i> PDF
                </button>
              </div>
            </div>
          </div>

          <!-- Info Message - NO ICON -->
          <div id="infoMessage" class="info-message" style="display: none">
            <p>No attendance records found.</p>
          </div>

          <!-- Attendance Table -->
          <div class="table-container">
            <table id="attendanceTable" style="display: none">
              <thead>
                <tr>
                  <th>Employee Name</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="inventory.html" class="nav-item"
          ><i class="fas fa-warehouse"></i><span>Inventory</span></a
        >
        <a href="profit report.html" class="nav-item"
          ><i class="fas fa-chart-line"></i><span>Profit</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>

    <script>
      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const nameParts = name.trim().split(" ");
let initials = "";
        if (nameParts.length >= 2) {
          initials = (
            nameParts[0].charAt(0) + nameParts[1].charAt(0)
          ).toUpperCase();
        }
        if (!initials && name) initials = name.charAt(0).toUpperCase();
        const hasImage = !!(user && user.profileImage);
        const imageSrc = user && user.profileImage ? user.profileImage : null;

        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--bg-white)";
          initialsSpan.style.color = "#000000";
          initialsSpan.style.fontWeight = "400 !important";
        }
      }

      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");

        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          window.location.href = "index.html";
          return null;
        }

        try {
          const user = JSON.parse(currentUser);
          return user;
        } catch (error) {
          console.error("Error parsing user data:", error);
          window.location.href = "index.html";
          return null;
        }
      }

      let attendanceData = [];
      let staffList = [];
      let currentUser = null;

      const addSelect = document.getElementById("addEmployee");
      const searchSelect = document.getElementById("searchEmployee");
      const statusSelect = document.getElementById("status");
      const infoMessage = document.getElementById("infoMessage");
      const attendanceBody = document.getElementById("attendanceBody");
      const attendanceTable = document.getElementById("attendanceTable");

      async function loadStaff() {
        try {
          const allStaff = await Optra.get("staff");
          if (currentUser && currentUser.businessId) {
            staffList = allStaff.filter(
              (s) =>
                s.businessId === currentUser.businessId &&
                s.status !== "inactive",
            );
          } else {
            staffList = allStaff;
          }

          addSelect.innerHTML = '<option value="">Select Employee</option>';
          searchSelect.innerHTML = '<option value="">Select Employee</option>';

          staffList.forEach((staff) => {
            const option1 = document.createElement("option");
            option1.value = staff.name;
            option1.textContent = staff.name;
            addSelect.appendChild(option1);

            const option2 = document.createElement("option");
            option2.value = staff.name;
            option2.textContent = staff.name;
            searchSelect.appendChild(option2);
          });
        } catch (error) {
          console.error("Error loading staff:", error);
        }
      }

      async function loadAttendance() {
        try {
          const allAttendance = await Optra.get("attendance");
          if (currentUser && currentUser.businessId) {
            attendanceData = allAttendance.filter(
              (a) => a.businessId === currentUser.businessId,
            );
          } else {
            attendanceData = allAttendance;
          }
          attendanceData.sort((a, b) => new Date(b.date) - new Date(a.date));
          renderTable(attendanceData);
        } catch (error) {
          console.error("Error loading attendance:", error);
        }
      }

      function renderTable(data) {
        if (data.length === 0) {
          attendanceTable.style.display = "none";
          infoMessage.style.display = "block";
          return;
        }

        infoMessage.style.display = "none";
        attendanceTable.style.display = "table";
        attendanceBody.innerHTML = "";

        data.forEach((item) => {
          const tr = document.createElement("tr");
          let statusClass = "";
          if (item.status === "Present") statusClass = "status-present";
          else if (item.status === "Late") statusClass = "status-late";
          else if (item.status === "Absent") statusClass = "status-absent";

          tr.innerHTML = `
          <td data-label="Name">${item.name}</td>
          <td data-label="Status"><span class="status-badge ${statusClass}">${item.status}</span></td>
          <td data-label="Date">${formatDate(item.date)}</td>
          <td data-label="Action">
            <button class="delete-btn" onclick="deleteAttendance('${item.id}')" title="Delete Record">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        `;
          attendanceBody.appendChild(tr);
        });
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const [year, month, day] = dateStr.split("-");
        return `${day}/${month}/${year}`;
      }

      window.addOrEditAttendance = async function () {
        const name = addSelect.value;
        const status = statusSelect.value;

        if (!name || !status) {
          alert("Please select an employee and status.");
          return;
        }

        const today = new Date().toISOString().split("T")[0];
        const existingIndex = attendanceData.findIndex(
          (a) =>
            a.name === name &&
            a.date === today &&
            a.businessId === currentUser?.businessId,
        );

        const attendanceRecord = {
          id:
            existingIndex !== -1
              ? attendanceData[existingIndex].id
              : Date.now().toString(),
          name: name,
          status: status,
          date: today,
          businessId: currentUser?.businessId || "default",
          timestamp: new Date().toISOString(),
        };

        try {
          const allAttendance = await Optra.get("attendance");

          if (existingIndex !== -1) {
            const globalIndex = allAttendance.findIndex(
              (a) => a.id === attendanceData[existingIndex].id,
            );
            if (globalIndex !== -1)
              allAttendance[globalIndex] = attendanceRecord;
          } else {
            allAttendance.push(attendanceRecord);
          }

          await Optra.set("attendance", allAttendance);
          await loadAttendance();
          statusSelect.value = "";
          alert(
            ` Attendance ${existingIndex !== -1 ? "updated" : "added"} for ${name}`,
          );
        } catch (error) {
          console.error("Error saving attendance:", error);
          alert(" Failed to save attendance.");
        }
      };

      window.deleteAttendance = async function (id) {
        if (!confirm("Are you sure you want to delete this attendance record?"))
          return;

        try {
          const allAttendance = await Optra.get("attendance");
          const updatedAttendance = allAttendance.filter((a) => a.id !== id);
          await Optra.set("attendance", updatedAttendance);
          await loadAttendance();
          alert("Attendance record deleted successfully!");
        } catch (error) {
          console.error("Error deleting attendance:", error);
          alert("Failed to delete attendance.");
        }
      };

      window.searchAttendance = function () {
        const name = searchSelect.value;
        if (!name) {
          alert("Please select an employee to search.");
          return;
        }
        const filtered = attendanceData.filter((a) => a.name === name);
        renderTable(filtered);
      };

      window.downloadPDF = function () {
        if (attendanceData.length === 0) {
          alert("No attendance records to export.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(18);
        doc.setTextColor("#1a365d");
        doc.text("Attendance Report - Optra", 14, 15);
        doc.setFontSize(10);
        doc.setTextColor("#333");
        doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 22);

        const tableData = attendanceData.map((a) => [
          a.name,
          a.status,
          formatDate(a.date),
        ]);
        doc.autoTable({
          startY: 30,
          head: [["Employee Name", "Status", "Date"]],
          body: tableData,
          styles: { fontSize: 10, cellPadding: 5 },
          headStyles: {
            fillColor: [26, 54, 93],
            textColor: 255,
            fontStyle: "bold",
          },
          alternateRowStyles: { fillColor: [245, 245, 245] },
        });
        doc.save(
          `Attendance_Report_${new Date().toISOString().split("T")[0]}.pdf`,
        );
      };

      window.downloadExcel = function () {
        if (attendanceData.length === 0) {
          alert("No attendance records to export.");
          return;
        }

        let csvContent = "Employee Name,Status,Date\n";
        attendanceData.forEach((a) => {
          csvContent += `"${a.name}",${a.status},${a.date}\n`;
        });
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute(
          "download",
          `Attendance_Report_${new Date().toISOString().split("T")[0]}.csv`,
        );
        link.click();
      };

      document.addEventListener("DOMContentLoaded", async () => {
        currentUser = checkAuth();
        if (currentUser) {
          await loadStaff();
          await loadAttendance();
          loadUserAvatar();
        }
      });
    </script><script src="api-config.js"></script>
    <script src="api.js"></script>
