<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Salary Payment · Optra</title>

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --dark-blue: #1a365d;
        --dark-blue-light: #2a4a7f;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        --text-dark: #1f2937;
        --text-gray: #6b7280;
        --success: #10b981;
        --error: #ef4444;
        --transition-smooth: all 0.2s ease;
        --radius-xl: 28px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background: #ffffff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER ===== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link:hover {
        color: var(--dark-blue);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: #9ca3af;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: var(--dark-blue);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition-smooth);
        background: var(--card-bg);
        flex-shrink: 0;
        position: relative;
      }
      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--dark-blue);
      }
      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }

      /* ===== SCROLLABLE CONTENT ===== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 60px;
        -webkit-overflow-scrolling: touch;
      }

      .container {
        max-width: 600px;
        margin: 16px auto 20px;
        padding: 0 15px;
        width: 100%;
      }

      /* ===== PAGE HEADER ===== */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .page-header h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--dark-blue);
        white-space: nowrap;
      }

      @media (max-width: 480px) {
        .page-header h2 {
          font-size: 18px;
        }
      }

      /* ===== FORM CARD ===== */
      .form-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-xl);
        padding: 24px 20px;
        box-shadow: var(--card-shadow);
      }

      @media (max-width: 480px) {
        .form-card {
          padding: 18px 14px;
        }
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        background: white;
        color: var(--text-dark);
        transition: var(--transition-smooth);
        font-family: inherit;
        appearance: none;
        -webkit-appearance: none;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--dark-blue);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
      }

      .form-group input[readonly] {
        background: #f9fafb;
        color: var(--text-gray);
        cursor: not-allowed;
      }

      .form-group input::placeholder {
        color: #9ca3af;
        font-weight: 400;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      @media (max-width: 480px) {
        .form-row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }

      /* ===== BUTTONS - Same Row on All Screens ===== */
      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .btn-submit {
        flex: 1;
        padding: 11px 16px;
        background: var(--dark-blue);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
        white-space: nowrap;
        text-align: center;
      }

      .btn-submit:hover {
        background: var(--dark-blue-light);
        transform: translateY(-2px);
      }

      .btn-cancel {
        flex: 1;
        padding: 11px 16px;
        background: #f3f4f6;
        color: var(--text-gray);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-decoration: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .btn-cancel:hover {
        background: #e5e7eb;
      }

      /* Small screens - buttons stay side by side */
      @media (max-width: 480px) {
        .form-actions {
          gap: 8px;
        }
        .btn-submit {
          font-size: 13px;
          padding: 10px 8px;
          flex: 1;
        }
        .btn-cancel {
          font-size: 13px;
          padding: 10px 8px;
          flex: 1;
        }
      }

      @media (max-width: 360px) {
        .btn-submit {
          font-size: 11px;
          padding: 8px 4px;
        }
        .btn-cancel {
          font-size: 11px;
          padding: 8px 4px;
        }
        .form-actions {
          gap: 4px;
        }
      }

      /* ===== MESSAGE ===== */
      .message {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        display: none;
        text-align: center;
      }

      .message.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
        border-left: 4px solid var(--success);
      }

      .message.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
        border-left: 4px solid var(--error);
      }

      /* ===== FOOTER ===== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 8px 0 10px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition-smooth);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition-smooth);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition-smooth);
      }

      .nav-item:hover {
        color: var(--dark-blue);
        transform: translateY(-3px);
        background: #ebf0f7;
      }

      .nav-item:hover i {
        color: var(--dark-blue);
        transform: scale(1.15);
      }

      .nav-item:hover span {
        color: var(--dark-blue);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      @media print {
        .main-header,
        .main-footer {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Salary Payment</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scrollable-content">
      <div class="container">
        <div class="page-header">
          <h2>Process Salary Payment</h2>
        </div>

        <div class="form-card">
          <form id="paymentForm">
            <div class="form-group">
              <select id="staffSelect" required>
                <option value="">-- Select Staff Member --</option>
              </select>
            </div>

            <div class="form-group">
              <input type="text" id="staffId" placeholder="Staff ID" readonly />
            </div>

            <div class="form-group">
              <input type="text" id="name" placeholder="Full Name" readonly />
            </div>

            <div class="form-row">
              <div class="form-group">
                <input type="email" id="email" placeholder="Email" readonly />
              </div>
              <div class="form-group">
                <input type="text" id="phone" placeholder="Phone" readonly />
              </div>
            </div>

            <div class="form-group">
              <input
                type="number"
                id="salary"
                placeholder="Monthly Salary"
                readonly
              />
            </div>

            <div class="form-group">
              <input type="date" id="paymentDate" required />
            </div>

            <div class="form-group">
              <input
                type="number"
                id="amountPaid"
                required
                min="0"
                step="1000"
                placeholder="Amount Paid"
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <input
                  type="number"
                  id="balance"
                  placeholder="Balance"
                  readonly
                />
              </div>
              <div class="form-group">
                <input
                  type="date"
                  id="nextPaymentDate"
                  placeholder="Next Payment"
                  readonly
                />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-submit">Save</button>
              <a href="staff management.html" class="btn-cancel">Cancel</a>
            </div>

            <div class="message" id="message"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="inventory.html" class="nav-item"
          ><i class="fas fa-warehouse"></i><span>Inventory</span></a
        >
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>
    </footer>

    <script>
      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");
        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          window.location.href = "index.html";
          return null;
        }
        try {
          return JSON.parse(currentUser);
        } catch (e) {
          window.location.href = "index.html";
          return null;
        }
      }

      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const parts = name.trim().split(" ");
        let initials =
          parts.length >= 2
            ? (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase()
            : parts[0].charAt(0).toUpperCase();
        if (!initials) initials = "U";

        let hasImage = false,
          imageSrc = null;
        if (user.profileImage) {
          imageSrc = user.profileImage;
          hasImage = true;
        }
        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--bg-white)";
          initialsSpan.style.color = "#000000";
        }
      }

      const user = checkAuth();
      const businessId = user ? user.businessId || "demoBiz" : "demoBiz";
      let staffList = [];

      const staffSelect = document.getElementById("staffSelect");
      const staffId = document.getElementById("staffId");
      const name = document.getElementById("name");
      const email = document.getElementById("email");
      const phone = document.getElementById("phone");
      const salary = document.getElementById("salary");
      const amountPaid = document.getElementById("amountPaid");
      const balance = document.getElementById("balance");
      const paymentDate = document.getElementById("paymentDate");
      const nextPaymentDate = document.getElementById("nextPaymentDate");
      const message = document.getElementById("message");
      const form = document.getElementById("paymentForm");

      function showMessage(text, isSuccess = true) {
        message.textContent = text;
        message.className = isSuccess ? "message success" : "message error";
        clearTimeout(message._timeout);
        message._timeout = setTimeout(() => {
          message.style.display = "none";
          message.className = "message";
        }, 4000);
      }

      async function loadStaff() {
        try {
          const allStaff = await Optra.get("staff");
          if (user && user.businessId) {
            staffList = allStaff.filter(
              (s) => s.businessId === user.businessId && s.status === "active",
            );
          } else {
            staffList = allStaff;
          }
          staffSelect.innerHTML =
            '<option value="">-- Select Staff Member --</option>';
          staffList.forEach((staff) => {
            const option = document.createElement("option");
            option.value = staff.id;
            option.textContent = `${staff.name} (ID: ${staff.staffId || staff.id})`;
            staffSelect.appendChild(option);
          });
        } catch (error) {
          console.error("Error loading staff:", error);
        }
      }

      staffSelect.addEventListener("change", () => {
        const selected = staffList.find((s) => s.id === staffSelect.value);
        if (selected) {
          staffId.value = selected.staffId || selected.id;
          name.value = selected.name || "";
          email.value = selected.email || "";
          phone.value = selected.phone || "";
          salary.value = selected.salary || 0;
          amountPaid.value = "";
          balance.value = "";
          nextPaymentDate.value = "";
        } else {
          staffId.value = "";
          name.value = "";
          email.value = "";
          phone.value = "";
          salary.value = "";
          amountPaid.value = "";
          balance.value = "";
          nextPaymentDate.value = "";
        }
      });

      function updateBalanceAndNextDate() {
        const sal = parseFloat(salary.value) || 0;
        const paid = parseFloat(amountPaid.value) || 0;
        if (paid > sal && sal > 0) {
          showMessage(
            `Amount cannot exceed salary (${sal.toLocaleString()} UGX)`,
            false,
          );
          amountPaid.value = "";
          balance.value = "";
          return;
        }
        balance.value = sal - paid;
        const date = new Date(paymentDate.value);
        if (!isNaN(date) && paymentDate.value) {
          date.setDate(date.getDate() + 30);
          nextPaymentDate.value = date.toISOString().split("T")[0];
        } else {
          nextPaymentDate.value = "";
        }
      }

      amountPaid.addEventListener("input", updateBalanceAndNextDate);
      paymentDate.addEventListener("input", updateBalanceAndNextDate);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!staffSelect.value) {
          showMessage("Please select a staff member.", false);
          return;
        }
        if (!paymentDate.value) {
          showMessage("Please select payment date.", false);
          return;
        }
        const paid = parseFloat(amountPaid.value) || 0;
        if (paid <= 0) {
          showMessage("Please enter a valid payment amount.", false);
          return;
        }
        const sal = parseFloat(salary.value) || 0;
        if (paid > sal) {
          showMessage(
            `Amount cannot exceed salary (${sal.toLocaleString()} UGX)`,
            false,
          );
          return;
        }

        const payment = {
          id: Date.now().toString(),
          businessId: businessId,
          staffId: staffId.value,
          staffName: name.value,
          email: email.value,
          phone: phone.value,
          salary: sal,
          paymentDate: paymentDate.value,
          amountPaid: paid,
          balance: sal - paid,
          nextPaymentDate: nextPaymentDate.value,
          timestamp: new Date().toISOString(),
          recordedBy: user?.name || user?.email || "Unknown",
        };

        try {
          const payments = await Optra.get("salary_payments");
          payments.push(payment);
          await Optra.set("salary_payments", payments);
          showMessage(
            `Payment saved! Amount: ${paid.toLocaleString()} UGX, Balance: ${(sal - paid).toLocaleString()} UGX`,
            true,
          );
          form.reset();
          staffId.value = "";
          name.value = "";
          email.value = "";
          phone.value = "";
          salary.value = "";
          balance.value = "";
          nextPaymentDate.value = "";
          paymentDate.value = new Date().toISOString().split("T")[0];
          staffSelect.innerHTML =
            '<option value="">-- Select Staff Member --</option>';
          await loadStaff();
        } catch (error) {
          console.error("Error saving payment:", error);
          showMessage("❌ Failed to save payment. Please try again.", false);
        }
      });

      document.addEventListener("DOMContentLoaded", async () => {
        if (user) {
          loadUserAvatar();
          const today = new Date().toISOString().split("T")[0];
          paymentDate.value = today;
          await loadStaff();
        }
      });
    </script><script src="api-config.js"></script>
    <script src="api.js"></script>
  </body>
</html>
