<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <title>Profit Summary · Optra</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="bizmate-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="bizmate-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="bizmate-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="bizmate-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="bizmate-192.png" />
    <link rel="shortcut icon" href="bizmate32.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
      /* ===== INVENTORY STYLE EXTENDED ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      }

      :root {
        --icon-gray: #9ca3af;
        --primary-grey: #6b7280;
        --light-grey: #e5e7eb;
        --bg-white: #ffffff;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
        --text-dark: #1f2937;
        --text-mid: #4b5563;
        --radius-xl: 24px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
        --transition: all 0.2s ease;
        --accent: #1a365d;
        --accent-bg: #ebf0f7;
        --coral: #ef476f;
        --electric-blue: #118ab2;
        --sky-blue: #06d6a0;
        --sunshine: #ffd166;
        --lilac: #9d4edd;
        --success: #06d6a0;
        --error: #ef476f;
        --pdf-red: #d32f2f;
        --green-600: #16a34a;
      }

      body {
        background: var(--bg-white);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER (identical to inventory) ===== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link:hover {
        color: var(--accent);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: var(--icon-gray);
        transition: var(--transition);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: var(--accent);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition);
        background: var(--bg-white);
        flex-shrink: 0;
        position: relative;
      }
      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--accent);
      }
      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-white);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }
      @media (min-width: 601px) and (max-width: 1024px) {
        .hamburger-link {
          font-size: 24px;
        }
        .page-title {
          font-size: 19px;
        }
        .avatar-btn {
          width: 46px;
          height: 46px;
        }
        .avatar-initials {
          font-size: 17px;
        }
        .icon-btn {
          font-size: 21px;
        }
      }
      @media (min-width: 1025px) {
        .hamburger-link {
          font-size: 28px;
        }
        .page-title {
          font-size: 22px;
        }
        .avatar-btn {
          width: 48px;
          height: 48px;
        }
        .avatar-initials {
          font-size: 18px;
        }
        .icon-btn {
          font-size: 24px;
        }
      }

      /* ===== SCROLLABLE CONTENT ===== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px;
      }

      .container {
        max-width: 1100px;
        margin: 20px auto 30px;
        padding: 0 15px;
        width: 100%;
      }

      /* ===== CARD (like inventory card) ===== */
      .profit-card-main {
        background: var(--card-bg);
        border-radius: var(--radius-xl);
        padding: 25px 20px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        margin-bottom: 30px;
      }

      .profit-card-main::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--accent);
      }

      .profit-card-main:hover {
        transform: translateY(-3px);
        box-shadow: 0 25px 40px -16px rgba(0, 0, 0, 0.12);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--card-border);
      }
      .card-header h1 {
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 700;
        color: #000000;
      }

      /* ===== SEARCH / CONTROLS (re-arranged - cleaner) ===== */
      .search-section {
        margin-bottom: 20px;
      }

      /* Main search row - item search + clear */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border-radius: 50px;
        padding: 0 12px 0 20px;
        border: 1px solid #eef2f6;
        transition: var(--transition);
        margin-bottom: 10px;
      }
      .search-row:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.08);
      }
      .search-row .search-input {
        flex: 1;
        padding: 10px 0;
        border: none;
        background: transparent;
        font-size: 14px;
        outline: none;
        color: var(--text-dark);
        min-width: 60px;
        font-weight: 400;
      }
      .search-row .search-input::placeholder {
        color: var(--icon-gray);
        font-weight: 400;
      }
      .search-row .search-btn {
        background: transparent;
        border: none;
        color: var(--icon-gray);
        font-size: 18px;
        cursor: pointer;
        padding: 8px 4px;
        transition: var(--transition);
        flex-shrink: 0;
      }
      .search-row .search-btn:hover {
        color: var(--accent);
        transform: scale(1.08);
      }

      /* Filter bar - date inputs + range toggle + buttons */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: #f8fafc;
        border-radius: var(--radius-md);
        padding: 8px 14px;
        border: 1px solid #eef2f6;
      }

      .filter-bar .date-group {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .filter-bar .date-input {
        padding: 6px 10px;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius-sm);
        font-size: 12px;
        background: white;
        color: var(--text-dark);
        height: 32px;
        min-width: 120px;
      }
      .filter-bar .date-input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .filter-bar .date-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-mid);
      }

      .filter-bar .range-toggle {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-left: 4px;
      }

      .filter-bar .range-toggle .icon-btn {
        background: white;
        border-radius: 30px;
        padding: 4px 12px;
        font-size: 11px;
        font-weight: 400;
        color: #000000;
        display: flex;
        align-items: center;
        gap: 5px;
        border: 1px solid #e2e8f0;
        transition: var(--transition);
        cursor: pointer;
        height: 30px;
      }
      .filter-bar .range-toggle .icon-btn:hover {
        border-color: var(--accent);
        background: var(--accent-bg);
      }
      .filter-bar .range-toggle .icon-btn i {
        font-size: 13px;
      }

      .filter-bar .filter-actions {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-left: auto;
      }

      .filter-bar .clear-btn {
        padding: 4px 12px;
        background: var(--coral);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        height: 30px;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .filter-bar .clear-btn:hover {
        opacity: 0.85;
      }

      @media (max-width: 768px) {
        .filter-bar {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-bar .date-group {
          flex-wrap: wrap;
          justify-content: center;
        }
        .filter-bar .filter-actions {
          margin-left: 0;
          justify-content: center;
        }
        .filter-bar .range-toggle {
          justify-content: center;
        }
        .filter-bar .date-input {
          min-width: 100px;
          flex: 1;
        }
      }

      @media (max-width: 480px) {
        .search-row {
          border-radius: var(--radius-md);
          padding: 0 10px;
        }
        .search-row .search-input {
          font-size: 12px;
          padding: 8px 0;
        }
        .filter-bar {
          padding: 6px 10px;
        }
        .filter-bar .date-input {
          font-size: 11px;
          padding: 4px 8px;
          min-width: 80px;
          height: 28px;
        }
        .filter-bar .range-toggle .icon-btn {
          font-size: 10px;
          padding: 3px 8px;
          height: 26px;
        }
        .filter-bar .clear-btn {
          font-size: 10px;
          padding: 3px 10px;
          height: 26px;
        }
      }

      /* ===== SUMMARY GRID (4 items like inventory) ===== */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }

      .summary-item {
        background: white;
        border-radius: var(--radius-sm);
        padding: 14px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--card-border);
        border-left: 4px solid var(--accent);
      }

      .summary-icon {
        width: auto;
        height: auto;
        background: transparent;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .icon-revenue {
        color: var(--sky-blue);
      }
      .icon-cost {
        color: var(--coral);
      }
      .icon-gross {
        color: var(--electric-blue);
      }
      .icon-net {
        color: var(--lilac);
      }

      .summary-info h4 {
        font-size: 11px;
        font-weight: 400;
        color: #000000;
        margin-bottom: 2px;
      }

      .summary-info span {
        font-size: 16px;
        font-weight: 700;
        color: #000000;
      }
      .summary-info .positive {
        color: var(--sky-blue);
      }
      .summary-info .negative {
        color: var(--coral);
      }

      /* ===== ACTION BUTTONS ===== */
      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }

      .action-btn {
        padding: 8px 14px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        color: white;
      }

      .action-btn:hover {
        transform: translateY(-2px);
      }

      .btn-pdf {
        background: var(--pdf-red);
        color: white;
      }
      .btn-pdf:hover {
        background: #b71c1c;
      }
      .btn-excel {
        background: #1e7e34;
      }
      .btn-excel:hover {
        background: #145a24;
      }

      /* ===== TABLE (like inventory) ===== */
      .table-container {
        overflow-x: visible;
        margin: 15px 0;
        border-radius: var(--radius-sm);
        background: white;
        border: 1px solid var(--card-border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: var(--accent);
        color: white;
        padding: 10px 8px;
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
      }

      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--card-border);
        color: var(--text-dark);
        font-size: 13px;
        font-weight: 400;
      }

      tr:hover {
        background: var(--accent-bg);
      }

      .profit-positive {
        color: var(--sky-blue);
        font-weight: 700;
      }
      .profit-negative {
        color: var(--coral);
        font-weight: 700;
      }

      .no-records {
        text-align: center;
        padding: 30px;
        color: var(--text-mid);
        font-style: italic;
        font-weight: 400;
      }

      /* ===== CHART SECTION ===== */
      .chart-section {
        background: white;
        border-radius: var(--radius-md);
        padding: 20px;
        border: 1px solid var(--card-border);
        margin-top: 20px;
      }

      .chart-section h3 {
        font-size: 16px;
        font-weight: 700;
        color: #000000;
        margin-bottom: 15px;
      }

      .chart-container {
        position: relative;
        width: 100%;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        max-width: 100%;
        max-height: 220px;
      }

      /* ===== FOOTER (identical to inventory) ===== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 10px 0 12px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition);
      }

      .nav-item:hover {
        color: var(--accent);
        transform: translateY(-3px);
        background: var(--accent-bg);
      }
      .nav-item:hover i {
        color: var(--accent);
        transform: scale(1.15);
      }
      .nav-item:hover span {
        color: var(--accent);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      /* ===== RESPONSIVE TWEAKS ===== */
      @media (max-width: 640px) {
        .container {
          padding: 0 6px;
          margin: 10px auto 16px;
        }
        .profit-card-main {
          padding: 14px 10px;
          border-radius: var(--radius-lg);
        }
        .card-header {
          margin-bottom: 12px;
          padding-bottom: 10px;
        }
        .card-header h1 {
          font-size: 18px;
        }

        .summary-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .summary-item {
          padding: 10px 8px;
          gap: 8px;
        }
        .summary-icon {
          font-size: 16px;
        }
        .summary-info h4 {
          font-size: 10px;
          font-weight: 400;
        }
        .summary-info span {
          font-size: 13px;
          font-weight: 700;
        }

        .actions {
          gap: 6px;
          margin-bottom: 12px;
        }
        .action-btn {
          padding: 6px 10px;
          font-size: 11px;
          gap: 4px;
          font-weight: 600;
        }

        .table-container {
          border-radius: var(--radius-sm);
          margin: 8px 0;
          border: 1px solid var(--card-border);
          overflow: visible;
          background: transparent;
        }
        table {
          width: 100%;
          display: table;
        }
        thead {
          display: none;
        }
        tbody {
          display: block;
          width: 100%;
        }
        tbody tr {
          display: block;
          width: 100%;
          margin-bottom: 12px;
          border: 1px solid var(--card-border);
          border-radius: var(--radius-sm);
          padding: 12px 14px;
          background: white;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        tbody tr:hover {
          background: white;
        }
        td {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 6px 0;
          border: none;
          border-bottom: 1px solid #f1f5f9;
          font-size: 12px;
          gap: 10px;
          width: 100%;
          box-sizing: border-box;
          font-weight: 400;
        }
        td:last-child {
          border-bottom: none;
        }
        td .td-label {
          font-weight: 600;
          color: #000000;
          font-size: 11px;
          flex-shrink: 0;
          min-width: 80px;
          text-transform: uppercase;
          letter-spacing: 0.3px;
        }
        td .td-value {
          text-align: right;
          font-weight: 500;
          color: var(--text-dark);
          font-size: 12px;
          word-break: break-word;
          flex: 1;
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 6px;
        }
        .chart-container {
          height: 180px;
        }
        .chart-section h3 {
          font-size: 14px;
          font-weight: 700;
        }
      }

      @media (max-width: 400px) {
        .profit-card-main {
          padding: 10px 6px;
        }
        .card-header h1 {
          font-size: 16px;
        }
        .summary-grid {
          grid-template-columns: 1fr 1fr;
          gap: 6px;
        }
        .summary-item {
          padding: 8px 6px;
        }
        .summary-icon {
          font-size: 14px;
        }
        .summary-info span {
          font-size: 12px;
        }
        .action-btn {
          font-size: 10px;
          padding: 5px 7px;
          gap: 3px;
        }
        td {
          font-size: 11px;
          padding: 4px 0;
        }
        td .td-label {
          min-width: 60px;
          font-size: 10px;
        }
        td .td-value {
          font-size: 11px;
        }
        tbody tr {
          padding: 8px 10px;
        }
        .chart-container {
          height: 150px;
        }
      }

      @media (min-width: 641px) and (max-width: 900px) {
        .summary-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (min-width: 901px) {
        .summary-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Profit Summary</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scrollable-content">
      <div class="container">
        <div class="profit-card-main">
          <div class="card-header">
            <h1>Profit &amp; Loss</h1>
          </div>

          <!-- ===== SEARCH SECTION - RE-ARRANGED ===== -->
          <div class="search-section">
            <!-- Row 1: Item search -->
            <div class="search-row">
              <input
                type="text"
                class="search-input"
                id="searchItem"
                placeholder="Search by item name..."
                oninput="filterProfit()"
              />
              <button
                class="search-btn"
                onclick="clearItemSearch()"
                title="Clear search"
              >
                <i class="fas fa-times"></i>
              </button>
            </div>

            <!-- Row 2: Filter bar with dates + range toggle + clear -->
            <div class="filter-bar">
              <div class="date-group">
                <span class="date-label"
                  ><i class="fas fa-calendar-alt"></i> From</span
                >
                <input
                  type="date"
                  class="date-input"
                  id="startDate"
                  onchange="filterProfit()"
                />
                <span class="date-label">To</span>
                <input
                  type="date"
                  class="date-input"
                  id="endDate"
                  onchange="filterProfit()"
                />
              </div>

              <div class="range-toggle">
                <button class="icon-btn" id="dailyBtn" onclick="setDaily()">
                  <i class="fas fa-calendar-day"></i> Daily
                </button>
                <button class="icon-btn" id="rangeBtn" onclick="setRange()">
                  <i class="fas fa-calendar-alt"></i> Range
                </button>
              </div>

              <div class="filter-actions">
                <button class="clear-btn" onclick="clearAllFilters()">
                  <i class="fas fa-undo-alt"></i> Reset
                </button>
              </div>
            </div>
          </div>

          <!-- ===== SUMMARY GRID ===== -->
          <div class="summary-grid">
            <div class="summary-item">
              <span class="summary-icon icon-revenue"
                ><i class="fas fa-chart-line"></i
              ></span>
              <div class="summary-info">
                <h4>Total Revenue</h4>
                <span id="totalRevenue">UGX 0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-cost"
                ><i class="fas fa-wallet"></i
              ></span>
              <div class="summary-info">
                <h4>Total Cost</h4>
                <span id="totalCost">UGX 0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-gross"
                ><i class="fas fa-balance-scale"></i
              ></span>
              <div class="summary-info">
                <h4>Gross Profit</h4>
                <span id="grossProfit">UGX 0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-net"
                ><i class="fas fa-chart-pie"></i
              ></span>
              <div class="summary-info">
                <h4>Net Profit</h4>
                <span id="netProfit">UGX 0</span>
              </div>
            </div>
          </div>

          <!-- ===== ACTIONS ===== -->
          <div class="actions">
            <button class="action-btn btn-pdf" onclick="downloadPDF()">
              <i class="fas fa-file-pdf"></i> PDF
            </button>
            <button class="action-btn btn-excel" onclick="exportExcel()">
              <i class="fas fa-file-excel"></i> Excel
            </button>
          </div>

          <!-- ===== TABLE ===== -->
          <div class="table-container">
            <table id="profitTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Item</th>
                  <th>Qty</th>
                  <th>Selling Price</th>
                  <th>Buying Price</th>
                  <th>Revenue</th>
                  <th>Cost</th>
                  <th>Profit/Loss</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div id="noRecordsMsg" class="no-records"></div>

          <!-- ===== CHART ===== -->
          <div class="chart-section">
            <h3>
              <i
                class="fas fa-chart-bar"
                style="color: var(--accent); margin-right: 8px"
              ></i>
              Profit Analysis
            </h3>
            <div class="chart-container">
              <canvas id="profitChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="inventory.html" class="nav-item"
          ><i class="fas fa-warehouse"></i><span>Inventory</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>
    </footer>

    <script>
      // ===== AVATAR =====
      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const parts = name.trim().split(" ");
        let initials =
          parts.length >= 2
            ? (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase()
            : parts[0].charAt(0).toUpperCase();
        if (!initials) initials = "U";

        let hasImage = false,
          imageSrc = null;
        if (user.profileImage) {
          imageSrc = user.profileImage;
          hasImage = true;
        }
        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--bg-white)";
          initialsSpan.style.color = "#000000";
        }
      }

      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");
        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          window.location.href = "index.html";
          return null;
        }
        try {
          const user = JSON.parse(currentUser);
          loadUserAvatar();
          return user;
        } catch (_) {
          window.location.href = "index.html";
          return null;
        }
      }

      const user = checkAuth();
      const businessId = user ? user.businessId || "demoBiz" : "demoBiz";

      // ===== DATA =====
      let allSales = [],
        allExpenses = [],
        allPurchases = [],
        allOtherIncome = [];
      let chartInstance = null;
      let filteredSales = [];

      function formatNumber(num) {
        return isNaN(num) ? "0" : Number(num).toLocaleString("en-UG");
      }

      function getBuyingPrice(itemName) {
        const relevant = allPurchases.filter((p) => {
          if (p.items)
            return p.items.some(
              (i) =>
                (i.goods || i.name)?.toLowerCase() === itemName.toLowerCase(),
            );
          return (p.goods || p.item)?.toLowerCase() === itemName.toLowerCase();
        });
        if (!relevant.length) return null;
        relevant.sort(
          (a, b) =>
            new Date(b.paymentDate || b.date || 0) -
            new Date(a.paymentDate || a.date || 0),
        );
        const latest = relevant[0];
        if (latest.items)
          return (
            latest.items.find(
              (i) =>
                (i.goods || i.name)?.toLowerCase() === itemName.toLowerCase(),
            )?.price || null
          );
        return latest.price || null;
      }

      async function loadData() {
        try {
          const sales = await Optra.get("sales");
          const expenses = await Optra.get("expenses");
          const purchases = await Optra.get("purchases");
          const otherIncome = await Optra.get("other_income");
          if (user && user.businessId) {
            allSales = sales.filter((s) => s.businessId === user.businessId);
            allExpenses = expenses.filter(
              (e) => e.businessId === user.businessId,
            );
            allPurchases = purchases.filter(
              (p) => p.businessId === user.businessId,
            );
            allOtherIncome = otherIncome.filter(
              (oi) => oi.businessId === user.businessId,
            );
          } else {
            allSales = sales;
            allExpenses = expenses;
            allPurchases = purchases;
            allOtherIncome = otherIncome;
          }
          // initial filter
          applyDateFilter();
        } catch (e) {
          console.error(e);
        }
      }

      function applyDateFilter() {
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;
        let filtered = allSales;
        if (start && end) {
          filtered = allSales.filter(
            (s) => s.date && s.date >= start && s.date <= end,
          );
        } else if (start) {
          filtered = allSales.filter((s) => s.date && s.date >= start);
        } else if (end) {
          filtered = allSales.filter((s) => s.date && s.date <= end);
        }
        filteredSales = filtered;
        updateSummary(filteredSales);
      }

      function updateSummary(sales) {
        const itemFilter = document
          .getElementById("searchItem")
          .value.trim()
          .toLowerCase();

        let totalRevenue = 0,
          totalCost = 0,
          items = [];
        sales.forEach((sale) => {
          if (sale.items) {
            sale.items.forEach((item) => {
              const qty = item.qty || item.quantity || 0,
                revenue = item.total || 0,
                name = item.name || "Unknown";
              if (itemFilter && !name.toLowerCase().includes(itemFilter))
                return;
              const sellingPrice = qty > 0 ? revenue / qty : 0;
              const buyingPrice = getBuyingPrice(name);
              const unitCost =
                buyingPrice !== null ? buyingPrice : sellingPrice;
              const cost = unitCost * qty;
              totalRevenue += revenue;
              totalCost += cost;
              items.push({
                name,
                qty,
                sellingPrice,
                buyingPrice: unitCost,
                revenue,
                cost,
                profit: revenue - cost,
              });
            });
          } else {
            const qty = sale.quantity || 1,
              revenue = sale.total || 0,
              name = sale.item || "Unknown";
            if (itemFilter && !name.toLowerCase().includes(itemFilter)) return;
            const sellingPrice = qty > 0 ? revenue / qty : 0;
            const buyingPrice = getBuyingPrice(name);
            const unitCost = buyingPrice !== null ? buyingPrice : sellingPrice;
            const cost = unitCost * qty;
            totalRevenue += revenue;
            totalCost += cost;
            items.push({
              name,
              qty,
              sellingPrice,
              buyingPrice: unitCost,
              revenue,
              cost,
              profit: revenue - cost,
            });
          }
        });

        const totalExp = allExpenses.reduce((s, e) => s + (e.amount || 0), 0);
        const totalOther = allOtherIncome.reduce(
          (s, oi) => s + (oi.amount || 0),
          0,
        );
        const grossProfit = totalRevenue - totalCost;
        const netProfit = grossProfit - totalExp + totalOther;

        document.getElementById("totalRevenue").innerHTML =
          `UGX ${formatNumber(totalRevenue)}`;
        document.getElementById("totalCost").innerHTML =
          `UGX ${formatNumber(totalCost)}`;
        const grossEl = document.getElementById("grossProfit");
        grossEl.innerHTML = `UGX ${formatNumber(grossProfit)}`;
        grossEl.className = grossProfit >= 0 ? "positive" : "negative";
        const netEl = document.getElementById("netProfit");
        netEl.innerHTML =
          netProfit >= 0
            ? `UGX ${formatNumber(netProfit)}`
            : `-UGX ${formatNumber(Math.abs(netProfit))}`;
        netEl.className = netProfit >= 0 ? "positive" : "negative";

        renderTable(items, totalRevenue, totalCost, grossProfit);
        drawChart(
          totalRevenue,
          totalCost,
          totalExp,
          totalOther,
          grossProfit,
          netProfit,
        );
      }

      function renderTable(items, totalRevenue, totalCost, grossProfit) {
        const tbody = document.getElementById("tableBody");
        const noMsg = document.getElementById("noRecordsMsg");
        tbody.innerHTML = "";
        if (!items.length) {
          noMsg.textContent = "No sales data for the selected filters.";
          return;
        }
        noMsg.textContent = "";

        items.forEach((item, idx) => {
          const tr = document.createElement("tr");
          const profitClass =
            item.profit >= 0 ? "profit-positive" : "profit-negative";
          tr.innerHTML = `
            <td><span class="td-label">#</span><span class="td-value">${idx + 1}</span></td>
            <td><span class="td-label">Item</span><span class="td-value">${item.name}</span></td>
            <td><span class="td-label">Qty</span><span class="td-value">${item.qty}</span></td>
            <td><span class="td-label">Sell Price</span><span class="td-value">UGX ${formatNumber(item.sellingPrice)}</span></td>
            <td><span class="td-label">Buy Price</span><span class="td-value">UGX ${formatNumber(item.buyingPrice)}</span></td>
            <td><span class="td-label">Revenue</span><span class="td-value">UGX ${formatNumber(item.revenue)}</span></td>
            <td><span class="td-label">Cost</span><span class="td-value">UGX ${formatNumber(item.cost)}</span></td>
            <td><span class="td-label">P/L</span><span class="td-value ${profitClass}">UGX ${formatNumber(item.profit)}</span></td>
          `;
          tbody.appendChild(tr);
        });

        // total row
        const trTotal = document.createElement("tr");
        const totalClass =
          grossProfit >= 0 ? "profit-positive" : "profit-negative";
        trTotal.innerHTML = `
          <td colspan="2"><strong>TOTALS</strong></td>
          <td><span class="td-label">-</span><span class="td-value">-</span></td>
          <td><span class="td-label">-</span><span class="td-value">-</span></td>
          <td><span class="td-label">-</span><span class="td-value">-</span></td>
          <td><span class="td-label">Revenue</span><span class="td-value"><strong>UGX ${formatNumber(totalRevenue)}</strong></span></td>
          <td><span class="td-label">Cost</span><span class="td-value"><strong>UGX ${formatNumber(totalCost)}</strong></span></td>
          <td><span class="td-label">Gross</span><span class="td-value ${totalClass}"><strong>UGX ${formatNumber(grossProfit)}</strong></span></td>
        `;
        tbody.appendChild(trTotal);
      }

      function drawChart(revenue, cost, expenses, otherIncome, gross, net) {
        const ctx = document.getElementById("profitChart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels: [
              "Revenue",
              "Cost",
              "Expenses",
              "Other Inc.",
              "Gross",
              "Net",
            ],
            datasets: [
              {
                label: "UGX",
                data: [revenue, cost, expenses, otherIncome, gross, net],
                backgroundColor: [
                  "#06d6a0",
                  "#ef476f",
                  "#ffd166",
                  "#9d4edd",
                  gross >= 0 ? "#118ab2" : "#ef476f",
                  net >= 0 ? "#06d6a0" : "#ef476f",
                ],
                borderRadius: 5,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `UGX ${ctx.raw.toLocaleString()}`,
                },
              },
            },
            scales: {
              y: { ticks: { callback: (v) => `UGX ${v.toLocaleString()}` } },
            },
          },
        });
      }

      // ===== FILTERS =====
      window.filterProfit = function () {
        applyDateFilter();
      };

      window.clearItemSearch = function () {
        document.getElementById("searchItem").value = "";
        applyDateFilter();
      };

      window.clearAllFilters = function () {
        document.getElementById("searchItem").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
        applyDateFilter();
      };

      window.setDaily = function () {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("startDate").value = today;
        document.getElementById("endDate").value = today;
        applyDateFilter();
      };

      window.setRange = function () {
        const today = new Date().toISOString().split("T")[0];
        const lastMonth = new Date();
        lastMonth.setDate(lastMonth.getDate() - 30);
        document.getElementById("startDate").value = lastMonth
          .toISOString()
          .split("T")[0];
        document.getElementById("endDate").value = today;
        applyDateFilter();
      };

      // ===== EXPORT =====
      window.exportExcel = function () {
        const rows = [];
        document.querySelectorAll("#profitTable tbody tr").forEach((tr) => {
          const row = [];
          tr.querySelectorAll("td").forEach((td) => row.push(td.innerText));
          if (row.length) rows.push(row);
        });
        if (!rows.length) {
          alert("No data to export");
          return;
        }
        const headers = [
          "#",
          "Item",
          "Qty",
          "Selling Price",
          "Buying Price",
          "Revenue",
          "Cost",
          "Profit/Loss",
        ];
        let csv = [headers.join(",")];
        rows.forEach((r) => csv.push(r.join(",")));
        const blob = new Blob([csv.join("\n")], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Profit_Summary_${new Date().toISOString().split("T")[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      };

      window.downloadPDF = async function () {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const bizInfo = await Optra.get("business_info");
        const bizName = bizInfo.name || "Optra Business";
        doc.setFontSize(16);
        doc.setTextColor("#1a365d");
        doc.text(bizName, 14, 15);
        doc.setFontSize(10);
        doc.setTextColor("#333");
        doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 22);
        doc.setFontSize(14);
        doc.text("Profit Summary", 14, 33);

        const tableData = [];
        document.querySelectorAll("#profitTable tbody tr").forEach((tr) => {
          const row = [];
          tr.querySelectorAll("td").forEach((td) => row.push(td.innerText));
          if (row.length) tableData.push(row);
        });
        if (!tableData.length) {
          alert("No data to export");
          return;
        }
        doc.autoTable({
          startY: 40,
          head: [
            [
              "#",
              "Item",
              "Qty",
              "Sell Price",
              "Buy Price",
              "Revenue",
              "Cost",
              "P/L",
            ],
          ],
          body: tableData,
          styles: { fontSize: 8, cellPadding: 3 },
          headStyles: { fillColor: [26, 54, 93], textColor: 255 },
        });
        doc.save(
          `Profit_Summary_${new Date().toISOString().split("T")[0]}.pdf`,
        );
      };

      // ===== INIT =====
      document.addEventListener("DOMContentLoaded", async function () {
        const today = new Date().toISOString().split("T")[0];
        document.getElementById("startDate").value = today;
        document.getElementById("endDate").value = today;
        await loadData();
        setInterval(loadData, 30000);
      });
    </script><script src="api-config.js"></script>
    <script src="api.js"></script>
