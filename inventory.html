<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes"
    />
    <title>Inventory · Optra</title>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="bizmate-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="bizmate-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="bizmate-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="bizmate-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="bizmate-192.png" />
    <link rel="shortcut icon" href="bizmate32.png" />

    <!-- Font Awesome & Google Fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Chart.js & PDF libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
      /* ===== ROOT ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", system-ui, sans-serif;
      }

      :root {
        --icon-gray: #9ca3af;
        --primary-grey: #6b7280;
        --light-grey: #e5e7eb;
        --bg-white: #ffffff;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.08);
        --text-dark: #1f2937;
        --text-mid: #4b5563;
        --radius-xl: 24px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-sm: 10px;
        --transition: all 0.2s ease;
        --accent: #1a365d;
        --accent-light: #2a4a7f;
        --accent-bg: #ebf0f7;
        --link-blue: #1a56db;
        --dark-blue: #1a365d;
        --coral: #ef476f;
        --electric-blue: #118ab2;
        --sky-blue: #06d6a0;
        --sunshine: #ffd166;
        --lilac: #9d4edd;
        --success: #06d6a0;
        --error: #ef476f;
        --pdf-red: #d32f2f;
        --green-600: #16a34a;
      }

      body {
        background: var(--bg-white);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER ===== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link:hover {
        color: var(--accent);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: var(--icon-gray);
        transition: var(--transition);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: var(--accent);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition);
        background: var(--bg-white);
        flex-shrink: 0;
        position: relative;
      }
      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--accent);
      }
      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-white);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }
      @media (min-width: 601px) and (max-width: 1024px) {
        .hamburger-link {
          font-size: 24px;
        }
        .page-title {
          font-size: 19px;
        }
        .avatar-btn {
          width: 46px;
          height: 46px;
        }
        .avatar-initials {
          font-size: 17px;
        }
        .icon-btn {
          font-size: 21px;
        }
      }
      @media (min-width: 1025px) {
        .hamburger-link {
          font-size: 28px;
        }
        .page-title {
          font-size: 22px;
        }
        .avatar-btn {
          width: 48px;
          height: 48px;
        }
        .avatar-initials {
          font-size: 18px;
        }
        .icon-btn {
          font-size: 24px;
        }
      }

      /* ===== SCROLLABLE CONTENT ===== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 80px;
      }

      .container {
        max-width: 1000px;
        margin: 20px auto 30px;
        padding: 0 15px;
        width: 100%;
      }

      /* ===== INVENTORY CARD ===== */
      .inventory-card-main {
        background: var(--card-bg);
        border-radius: var(--radius-xl);
        padding: 25px 20px;
        border: 1px solid var(--card-border);
        box-shadow: var(--card-shadow);
        transition: var(--transition);
        position: relative;
        overflow: hidden;
        margin-bottom: 30px;
      }

      .inventory-card-main::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--accent);
      }

      .inventory-card-main:hover {
        transform: translateY(-3px);
        box-shadow: 0 25px 40px -16px rgba(0, 0, 0, 0.12);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--card-border);
      }
      .card-header h1 {
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 700;
        color: #000000;
      }

      /* ===== SEARCH ===== */
      .search-section {
        margin-bottom: 20px;
      }
      .search-container {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border-radius: 50px;
        padding: 0 12px 0 20px;
        border: 1px solid #eef2f6;
        transition: var(--transition);
        flex-wrap: nowrap;
        overflow: hidden;
      }
      .search-container:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.08);
      }
      .search-input {
        flex: 1;
        padding: 10px 0;
        border: none;
        background: transparent;
        font-size: 14px;
        outline: none;
        color: var(--text-dark);
        min-width: 60px;
      }
      .search-input[type="date"] {
        padding: 10px 0;
        width: auto;
        min-width: 80px;
      }
      .search-input::placeholder {
        color: var(--icon-gray);
      }
      .search-btn {
        background: transparent;
        border: none;
        color: var(--icon-gray);
        font-size: 18px;
        cursor: pointer;
        padding: 8px 4px;
        transition: var(--transition);
        flex-shrink: 0;
      }
      .search-btn:hover {
        color: var(--accent);
        transform: scale(1.08);
      }

      /* ===== SUMMARY CARDS ===== */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 20px;
      }

      .summary-item {
        background: white;
        border-radius: var(--radius-sm);
        padding: 14px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--card-border);
        border-left: 4px solid var(--accent);
      }

      .summary-icon {
        width: auto;
        height: auto;
        background: transparent;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .icon-total-items {
        color: #000000;
      }
      .icon-total-units {
        color: var(--icon-gray);
      }
      .icon-total-value {
        color: var(--green-600);
      }
      .icon-low-stock {
        color: var(--error);
      }

      .summary-info h4 {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-mid);
        margin-bottom: 2px;
      }

      .summary-info span {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-dark);
      }

      /* ===== ACTION BUTTONS ===== */
      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }

      .action-btn {
        padding: 8px 14px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        color: white;
      }

      .action-btn:hover {
        transform: translateY(-2px);
      }

      .btn-pdf {
        background: var(--pdf-red);
        color: white;
      }

      .btn-pdf:hover {
        background: #b71c1c;
      }

      /* ===== TABLE ===== */
      .table-container {
        overflow-x: auto;
        margin: 15px 0;
        border-radius: var(--radius-sm);
        background: white;
        border: 1px solid var(--card-border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
      }

      th {
        background: var(--accent);
        color: white;
        padding: 10px 8px;
        font-size: 12px;
        font-weight: 600;
        text-align: left;
        white-space: nowrap;
      }

      td {
        padding: 10px 8px;
        border-bottom: 1px solid var(--card-border);
        color: var(--text-dark);
        font-size: 13px;
      }

      tr:hover {
        background: var(--accent-bg);
      }

      tr.low-stock {
        background: #fef2f2;
      }

      .stock-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 30px;
        font-size: 10px;
        font-weight: 600;
      }

      .stock-normal {
        background: #d1fae5;
        color: #065f46;
      }

      .stock-low {
        background: #fee2e2;
        color: #991b1b;
      }

      .edit-btn {
        background: transparent;
        border: none;
        color: var(--electric-blue);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
        transition: var(--transition);
      }

      .edit-btn:hover {
        color: var(--accent);
        transform: scale(1.1);
      }

      .delete-btn {
        background: transparent;
        border: none;
        color: var(--error);
        font-size: 16px;
        cursor: pointer;
        padding: 4px 6px;
        transition: var(--transition);
      }

      .delete-btn:hover {
        color: #ff5252;
        transform: scale(1.15);
      }

      .no-records {
        text-align: center;
        padding: 30px;
        color: var(--text-mid);
        font-style: italic;
      }

      /* ===== CHART SECTION ===== */
      .chart-section {
        background: white;
        border-radius: var(--radius-md);
        padding: 20px;
        border: 1px solid var(--card-border);
        margin-top: 20px;
      }

      .chart-section h3 {
        font-size: 16px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 15px;
      }

      .chart-container {
        position: relative;
        width: 100%;
        height: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        max-width: 100%;
        max-height: 220px;
      }

      .chart-legend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: #f8fafc;
        border-radius: 30px;
        font-size: 10px;
      }

      .legend-color {
        width: 10px;
        height: 10px;
        border-radius: 4px;
      }

      /* ===== FOOTER ===== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 10px 0 12px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 560px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition);
      }

      .nav-item:hover {
        color: var(--accent);
        transform: translateY(-3px);
        background: var(--accent-bg);
      }

      .nav-item:hover i {
        color: var(--accent);
        transform: scale(1.15);
      }

      .nav-item:hover span {
        color: var(--accent);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      /* ===== MOBILE TABLE ===== */
      @media (max-width: 768px) {
        .container {
          padding: 0 6px;
          margin: 10px auto 16px;
        }
        .inventory-card-main {
          padding: 14px 10px;
          border-radius: var(--radius-lg);
        }
        .card-header {
          margin-bottom: 12px;
          padding-bottom: 10px;
        }
        .card-header h1 {
          font-size: 18px;
        }

        .search-container {
          border-radius: var(--radius-md);
          padding: 6px 10px;
          flex-wrap: wrap;
          gap: 6px;
        }
        .search-input {
          font-size: 12px;
          padding: 6px 0;
          min-width: 45px;
          flex: 1 1 80px;
        }
        .search-input[type="date"] {
          min-width: 55px;
          padding: 6px 0;
          font-size: 11px;
        }
        .search-btn {
          font-size: 14px;
          padding: 4px 6px;
        }

        .summary-grid {
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
        .summary-item {
          padding: 10px 8px;
          gap: 8px;
        }
        .summary-icon {
          font-size: 16px;
        }
        .summary-info h4 {
          font-size: 10px;
        }
        .summary-info span {
          font-size: 13px;
        }

        .actions {
          gap: 6px;
          margin-bottom: 12px;
        }
        .action-btn {
          padding: 6px 10px;
          font-size: 11px;
          gap: 4px;
        }

        /* MOBILE: Hide table header, show cards with labels */
        .table-container {
          overflow: visible;
          background: transparent;
          border: none;
        }
        thead {
          display: none;
        }
        tbody {
          display: block;
          width: 100%;
        }
        tbody tr {
          display: block;
          width: 100%;
          margin-bottom: 12px;
          border: 1px solid var(--card-border);
          border-radius: var(--radius-sm);
          padding: 12px 14px;
          background: white;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        tbody tr:hover {
          background: white;
        }
        tbody tr.low-stock {
          background: #fef2f2;
          border-color: #fecaca;
        }
        td {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 6px 0;
          border: none;
          border-bottom: 1px solid #f1f5f9;
          font-size: 12px;
          gap: 10px;
          width: 100%;
          box-sizing: border-box;
        }
        td:last-child {
          border-bottom: none;
        }
        td .td-label {
          font-weight: 600;
          color: var(--text-mid);
          font-size: 11px;
          flex-shrink: 0;
          min-width: 80px;
          text-transform: uppercase;
          letter-spacing: 0.3px;
        }
        td .td-value {
          text-align: right;
          font-weight: 500;
          color: var(--text-dark);
          font-size: 12px;
          word-break: break-word;
          flex: 1;
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 6px;
        }
        td .td-value .stock-badge {
          font-size: 10px;
          padding: 2px 8px;
        }
        td .td-value .edit-btn,
        td .td-value .delete-btn {
          font-size: 14px;
          padding: 2px 4px;
        }
        .td-actions {
          display: flex;
          gap: 8px;
          justify-content: flex-end;
        }

        .chart-container {
          height: 180px;
        }
        .chart-section h3 {
          font-size: 14px;
        }
        .legend-item {
          font-size: 9px;
          padding: 3px 8px;
        }
      }

      @media (max-width: 400px) {
        .inventory-card-main {
          padding: 10px 6px;
        }
        .card-header h1 {
          font-size: 16px;
        }
        .search-container {
          padding: 4px 6px;
          gap: 4px;
        }
        .search-input {
          font-size: 11px;
          padding: 4px 0;
          min-width: 35px;
          flex: 1 1 60px;
        }
        .search-input[type="date"] {
          min-width: 45px;
          font-size: 10px;
        }
        .search-btn {
          font-size: 12px;
          padding: 3px 4px;
        }
        .summary-grid {
          grid-template-columns: 1fr 1fr;
          gap: 6px;
        }
        .summary-item {
          padding: 8px 6px;
        }
        .summary-icon {
          font-size: 14px;
        }
        .summary-info span {
          font-size: 12px;
        }
        .action-btn {
          font-size: 10px;
          padding: 5px 7px;
          gap: 3px;
        }
        td {
          font-size: 11px;
          padding: 4px 0;
        }
        td .td-label {
          min-width: 60px;
          font-size: 10px;
        }
        td .td-value {
          font-size: 11px;
        }
        tbody tr {
          padding: 8px 10px;
        }
        .chart-container {
          height: 150px;
        }
      }

      @media (min-width: 641px) and (max-width: 900px) {
        .summary-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 901px) {
        .summary-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Inventory</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scrollable-content">
      <div class="container">
        <div class="inventory-card-main">
          <div class="card-header">
            <h1>Inventory Management</h1>
          </div>

          <!-- search -->
          <div class="search-section">
            <div class="search-container">
              <input
                type="text"
                class="search-input"
                id="searchName"
                placeholder="Search item..."
                oninput="filterInventory()"
              />
              <input
                type="date"
                class="search-input"
                id="searchStartDate"
                placeholder="From"
                onchange="filterInventory()"
              />
              <input
                type="date"
                class="search-input"
                id="searchEndDate"
                placeholder="To"
                onchange="filterInventory()"
              />
              <button class="search-btn" onclick="clearAllFilters()">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>

          <!-- summary -->
          <div class="summary-grid">
            <div class="summary-item">
              <span class="summary-icon icon-total-items"
                ><i class="fas fa-boxes"></i
              ></span>
              <div class="summary-info">
                <h4>Total Items</h4>
                <span id="totalItems">0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-total-units"
                ><i class="fas fa-cubes"></i
              ></span>
              <div class="summary-info">
                <h4>Total Units</h4>
                <span id="totalUnits">0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-total-value"
                ><i class="fas fa-chart-line"></i
              ></span>
              <div class="summary-info">
                <h4>Total Value</h4>
                <span id="totalValue">UGX 0</span>
              </div>
            </div>
            <div class="summary-item">
              <span class="summary-icon icon-low-stock"
                ><i class="fas fa-exclamation-triangle"></i
              ></span>
              <div class="summary-info">
                <h4>Low Stock</h4>
                <span id="lowStockCount">0</span>
              </div>
            </div>
          </div>

          <!-- actions -->
          <div class="actions">
            <button class="action-btn btn-pdf" onclick="downloadPDF()">
              <i class="fas fa-file-pdf"></i> PDF
            </button>
          </div>

          <!-- table -->
          <div class="table-container">
            <table id="inventoryTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Item Name</th>
                  <th>Quantity</th>
                  <th>Unit Price</th>
                  <th>Total Value</th>
                  <th>Last Purchase</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr>
                  <td colspan="8" class="no-records">
                    No inventory items found.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="noRecordsMsg" class="no-records"></div>

          <!-- Chart -->
          <div class="chart-section">
            <h3>
              <i
                class="fas fa-chart-pie"
                style="color: var(--accent); margin-right: 8px"
              ></i>
              Stock Distribution
            </h3>
            <div class="chart-container">
              <canvas id="inventoryChart"></canvas>
            </div>
            <div class="chart-legend" id="customLegend"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="profit report.html" class="nav-item"
          ><i class="fas fa-chart-line"></i><span>Profit</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>
    </footer>

    <script>
      // ===== AVATAR =====
      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const parts = name.trim().split(" ");
        let initials =
          parts.length >= 2
            ? (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase()
            : parts[0].charAt(0).toUpperCase();
        if (!initials) initials = "U";

        let hasImage = false,
          imageSrc = null;
        if (user.profileImage) {
          imageSrc = user.profileImage;
          hasImage = true;
        }
        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--bg-white)";
          initialsSpan.style.color = "#000000";
        }
      }

      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");
        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          window.location.href = "index.html";
          return null;
        }
        try {
          const user = JSON.parse(currentUser);
          loadUserAvatar();
          return user;
        } catch (_) {
          window.location.href = "index.html";
          return null;
        }
      }

      // ===== INVENTORY LOGIC =====
      const user = checkAuth();
      const businessId = user ? user.businessId || "demoBiz" : "demoBiz";
      let inventory = {};
      let chartInstance = null;

      function seedDemoInventory() {
        if (Object.keys(inventory).length === 0) {
          inventory = {
            Tomatoes: {
              quantity: 45,
              unitPrice: 2500,
              lastPurchaseDate: "2026-07-10",
            },
            Onions: {
              quantity: 30,
              unitPrice: 1800,
              lastPurchaseDate: "2026-07-09",
            },
            Potatoes: {
              quantity: 12,
              unitPrice: 3200,
              lastPurchaseDate: "2026-07-08",
            },
            Cabbage: {
              quantity: 8,
              unitPrice: 1500,
              lastPurchaseDate: "2026-07-07",
            },
            Carrots: {
              quantity: 3,
              unitPrice: 2200,
              lastPurchaseDate: "2026-07-06",
            },
            "Green Peppers": {
              quantity: 6,
              unitPrice: 2800,
              lastPurchaseDate: "2026-07-05",
            },
            Soda: {
              quantity: 10,
              unitPrice: 2000,
              lastPurchaseDate: "2026-08-02",
            },
          };
        }
      }

      function formatNumber(num) {
        return isNaN(num) ? "0" : Number(num).toLocaleString("en-UG");
      }

      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function loadInventory() {
        try {
          const allPurchases = await Optra.get("purchases");
          const allSales = await Optra.get("sales");
          const bizPurchases = allPurchases.filter(
            (p) => p.businessId === businessId,
          );
          const bizSales = allSales.filter((s) => s.businessId === businessId);

          if (bizPurchases.length > 0) {
            inventory = {};
            bizPurchases.forEach((purchase) => {
              if (purchase.items && Array.isArray(purchase.items)) {
                purchase.items.forEach((item) => {
                  const itemName = item.goods || item.name || "Unnamed";
                  if (!inventory[itemName]) {
                    inventory[itemName] = {
                      quantity: 0,
                      unitPrice: 0,
                      lastPurchaseDate: "",
                    };
                  }
                  inventory[itemName].quantity += item.quantity || 0;
                  inventory[itemName].unitPrice = item.price || 0;
                  if (
                    purchase.paymentDate > inventory[itemName].lastPurchaseDate
                  ) {
                    inventory[itemName].lastPurchaseDate = purchase.paymentDate;
                    inventory[itemName].unitPrice = item.price || 0;
                  }
                });
              } else {
                const itemName = purchase.goods || purchase.item || "Unnamed";
                if (!inventory[itemName]) {
                  inventory[itemName] = {
                    quantity: 0,
                    unitPrice: 0,
                    lastPurchaseDate: "",
                  };
                }
                inventory[itemName].quantity += purchase.quantity || 0;
                inventory[itemName].unitPrice = purchase.price || 0;
                if (
                  purchase.paymentDate > inventory[itemName].lastPurchaseDate
                ) {
                  inventory[itemName].lastPurchaseDate = purchase.paymentDate;
                  inventory[itemName].unitPrice = purchase.price || 0;
                }
              }
            });

            bizSales.forEach((sale) => {
              if (sale.items && Array.isArray(sale.items)) {
                sale.items.forEach((item) => {
                  const itemName = item.name || item.goods || "Unnamed";
                  if (inventory[itemName]) {
                    inventory[itemName].quantity -=
                      item.qty || item.quantity || 0;
                  }
                });
              } else {
                const itemName = sale.item || sale.goods || "Unnamed";
                if (inventory[itemName]) {
                  inventory[itemName].quantity -= sale.quantity || 0;
                }
              }
            });

            Object.keys(inventory).forEach((key) => {
              if (inventory[key].quantity < 0) inventory[key].quantity = 0;
            });
          } else {
            seedDemoInventory();
          }

          let totalUnits = 0;
          let totalValue = 0;
          Object.keys(inventory).forEach((key) => {
            totalUnits += inventory[key].quantity;
            totalValue += inventory[key].quantity * inventory[key].unitPrice;
          });

          document.getElementById("totalItems").textContent =
            Object.keys(inventory).length;
          document.getElementById("totalUnits").textContent = totalUnits;
          document.getElementById("totalValue").textContent =
            `UGX ${formatNumber(totalValue)}`;
          const lowStockCount = Object.keys(inventory).filter(
            (key) => inventory[key].quantity < 5,
          ).length;
          document.getElementById("lowStockCount").textContent = lowStockCount;

          renderInventory();
        } catch (e) {
          console.error("Error loading inventory:", e);
          seedDemoInventory();
          renderInventory();
        }
      }

      function renderInventory() {
        const nameFilter = document
          .getElementById("searchName")
          .value.trim()
          .toLowerCase();
        const startDate = document.getElementById("searchStartDate").value;
        const endDate = document.getElementById("searchEndDate").value;

        let filteredItems = Object.keys(inventory);

        if (nameFilter) {
          filteredItems = filteredItems.filter((name) =>
            name.toLowerCase().includes(nameFilter),
          );
        }

        if (startDate || endDate) {
          filteredItems = filteredItems.filter((name) => {
            const item = inventory[name];
            if (!item.lastPurchaseDate) return false;
            const itemDate = new Date(item.lastPurchaseDate);
            if (startDate && endDate) {
              return (
                itemDate >= new Date(startDate) && itemDate <= new Date(endDate)
              );
            }
            if (startDate) return itemDate >= new Date(startDate);
            if (endDate) return itemDate <= new Date(endDate);
            return true;
          });
        }

        const tbody = document.getElementById("tableBody");
        const noMsg = document.getElementById("noRecordsMsg");
        tbody.innerHTML = "";

        if (filteredItems.length === 0) {
          noMsg.textContent = "No inventory items found.";
          updateChart([]);
          return;
        }
        noMsg.textContent = "";

        filteredItems.forEach((itemName, index) => {
          const item = inventory[itemName];
          const isLowStock = item.quantity < 5;
          const tr = document.createElement("tr");
          tr.className = isLowStock ? "low-stock" : "";

          // For desktop: normal table cells
          // For mobile: we use data-label attributes for the pseudo-element
          tr.innerHTML = `
            <td data-label="#">${index + 1}</td>
            <td data-label="Item Name">${escapeHtml(itemName)}</td>
            <td data-label="Quantity">${item.quantity}${isLowStock ? ' <span style="color:#dc2626;font-weight:600;font-size:11px;">⚠ Low!</span>' : ""}</td>
            <td data-label="Unit Price">UGX ${formatNumber(item.unitPrice)}</td>
            <td data-label="Total Value">UGX ${formatNumber(item.quantity * item.unitPrice)}</td>
            <td data-label="Last Purchase">${item.lastPurchaseDate || "N/A"}</td>
            <td data-label="Status"><span class="stock-badge ${isLowStock ? "stock-low" : "stock-normal"}">${isLowStock ? "Low Stock" : "In Stock"}</span></td>
            <td data-label="Actions">
              <button class="edit-btn" onclick="editItem('${escapeHtml(itemName)}')"><i class="fas fa-edit"></i></button>
              <button class="delete-btn" onclick="deleteItem('${escapeHtml(itemName)}')"><i class="fas fa-trash"></i></button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        updateChart(filteredItems);
      }

      function updateChart(items) {
        const ctx = document.getElementById("inventoryChart").getContext("2d");
        if (chartInstance) chartInstance.destroy();

        const legendContainer = document.getElementById("customLegend");
        legendContainer.innerHTML = "";

        if (items.length === 0) {
          legendContainer.innerHTML =
            '<span style="color:#9ca3af;font-size:13px;">No data to display</span>';
          return;
        }

        const data = items.map((name) => inventory[name].quantity);
        const labels = items;
        const colors = [
          "#FF6B6B",
          "#4ECDC4",
          "#45B7D1",
          "#96CEB4",
          "#FFEAA7",
          "#DDA0DD",
          "#98D8C8",
          "#F7DC6F",
          "#BB8FCE",
          "#85C1E2",
        ];

        chartInstance = new Chart(ctx, {
          type: "pie",
          data: {
            labels: labels,
            datasets: [
              {
                data: data,
                backgroundColor: colors.slice(0, items.length),
                borderWidth: 2,
                borderColor: "white",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function (ctx) {
                    return `${ctx.label}: ${ctx.raw} units`;
                  },
                },
              },
            },
          },
        });

        items.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "legend-item";
          div.innerHTML = `
          <span class="legend-color" style="background-color:${colors[index]}"></span>
          <span>${item}: ${data[index]} units</span>
        `;
          legendContainer.appendChild(div);
        });
      }

      window.editItem = async function (itemName) {
        const item = inventory[itemName];
        const newQty = prompt(
          `Edit quantity for "${itemName}":`,
          item.quantity,
        );
        if (newQty === null) return;
        const qty = parseInt(newQty);
        if (isNaN(qty) || qty < 0) {
          alert("Please enter a valid non-negative number.");
          return;
        }
        inventory[itemName].quantity = qty;
        renderInventory();
        await Optra.set("inventory", Object.values(inventory));
      };

      window.deleteItem = async function (itemName) {
        if (
          !confirm(
            `Are you sure you want to delete "${itemName}" from inventory?`,
          )
        )
          return;
        delete inventory[itemName];
        renderInventory();
        await Optra.set("inventory", Object.values(inventory));
      };

      window.filterInventory = function () {
        renderInventory();
      };

      window.clearAllFilters = function () {
        document.getElementById("searchName").value = "";
        document.getElementById("searchStartDate").value = "";
        document.getElementById("searchEndDate").value = "";
        renderInventory();
      };

      window.downloadPDF = async function () {
        if (Object.keys(inventory).length === 0) {
          alert("No inventory data to export.");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const biz = await Optra.get("business_info");

        doc.setFontSize(18);
        doc.setTextColor("#1a365d");
        doc.text(biz.name || "Optra Business", 14, 15);

        doc.setFontSize(10);
        doc.setTextColor("#4b5563");
        doc.text("Contact: " + (biz.contact || ""), 14, 23);
        doc.text("Email: " + (biz.email || ""), 14, 30);
        doc.text("Location: " + (biz.location || ""), 14, 37);

        doc.setFontSize(14);
        doc.setTextColor("#1a365d");
        doc.text("Inventory Report", 14, 47);

        doc.setFontSize(9);
        doc.setTextColor("#4b5563");
        doc.text("Generated: " + new Date().toLocaleDateString(), 14, 54);

        const tableData = Object.keys(inventory).map((name) => [
          name,
          inventory[name].quantity.toString(),
          `UGX ${formatNumber(inventory[name].unitPrice)}`,
          `UGX ${formatNumber(inventory[name].quantity * inventory[name].unitPrice)}`,
          inventory[name].lastPurchaseDate || "N/A",
          inventory[name].quantity < 5 ? "Low Stock" : "In Stock",
        ]);

        doc.autoTable({
          startY: 60,
          head: [
            [
              "Item",
              "Qty",
              "Unit Price",
              "Total Value",
              "Last Purchase",
              "Status",
            ],
          ],
          body: tableData,
          styles: { fontSize: 9, cellPadding: 4 },
          headStyles: { fillColor: [26, 54, 93], textColor: 255 },
        });

        var finalY = doc.lastAutoTable.finalY + 8;
        doc.setFontSize(8);
        doc.setTextColor("#9ca3af");
        doc.text("Generated by Optra Business Management System", 14, finalY);

        doc.save(
          `Inventory_Report_${new Date().toISOString().split("T")[0]}.pdf`,
        );
      };

      document.addEventListener("DOMContentLoaded", async function () {
        await loadInventory();
        setInterval(loadInventory, 30000);
      });
    </script><script src="api-config.js"></script>
    <script src="api.js"></script>
