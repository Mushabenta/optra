<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Change Password · Optra</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --dark-blue: #1a365d;
        --dark-blue-light: #2a4a7f;
        --dark-blue-bg: #ebf0f7;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        --text-dark: #000000;
        --text-gray: #6b7280;
        --success: #10b981;
        --error: #ef4444;
        --transition-smooth: all 0.2s ease;
        --radius-xl: 28px;
        --radius-lg: 16px;
        --radius-md: 14px;
        --radius-sm: 10px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Poppins",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        background: #ffffff;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ===== HEADER ===== */
      .main-header {
        background: #ffffff;
        padding: 8px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 1000;
        flex-shrink: 0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .hamburger-link {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 26px;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px 6px;
        background: transparent;
        border: none;
      }
      .hamburger-link:hover {
        color: var(--dark-blue);
        transform: scale(1.05);
      }

      .header-center {
        flex: 1;
        text-align: center;
        padding: 0 8px;
      }

      .page-title {
        font-size: 20px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 0 0 auto;
      }

      .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 22px;
        color: #9ca3af;
        transition: var(--transition-smooth);
        text-decoration: none;
        padding: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: var(--dark-blue);
        transform: scale(1.1);
      }

      .avatar-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        overflow: hidden;
        border: 2px solid var(--card-border);
        transition: var(--transition-smooth);
        background: var(--card-bg);
        flex-shrink: 0;
        position: relative;
      }
      .avatar-btn:hover {
        transform: scale(1.04);
        border-color: var(--dark-blue);
      }
      .avatar-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .avatar-initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--card-bg);
        color: #000000;
        font-weight: 400 !important;
        font-size: 18px;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .main-header {
          padding: 6px 12px;
        }
        .hamburger-link {
          font-size: 22px;
          padding: 4px;
        }
        .page-title {
          font-size: 17px;
        }
        .avatar-btn {
          width: 42px;
          height: 42px;
        }
        .avatar-initials {
          font-size: 16px;
        }
        .icon-btn {
          font-size: 19px;
        }
      }
      @media (max-width: 400px) {
        .hamburger-link {
          font-size: 18px;
          padding: 2px;
        }
        .page-title {
          font-size: 15px;
        }
        .avatar-btn {
          width: 38px;
          height: 38px;
        }
        .avatar-initials {
          font-size: 14px;
        }
        .icon-btn {
          font-size: 17px;
        }
        .main-header {
          padding: 4px 8px;
        }
      }

      /* ===== SCROLLABLE CONTENT ===== */
      .scrollable-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding-bottom: 60px;
        -webkit-overflow-scrolling: touch;
      }

      .container {
        max-width: 500px;
        margin: 16px auto 20px;
        padding: 0 15px;
        width: 100%;
      }

      /* ===== PAGE HEADER ===== */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .page-header h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--dark-blue);
        white-space: nowrap;
      }

      @media (max-width: 480px) {
        .page-header h2 {
          font-size: 18px;
        }
      }

      /* ===== FORM CARD ===== */
      .form-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-xl);
        padding: 24px 20px;
        box-shadow: var(--card-shadow);
      }

      @media (max-width: 480px) {
        .form-card {
          padding: 16px 12px;
        }
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 4px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        background: white;
        transition: var(--transition-smooth);
      }

      .input-wrapper:focus-within {
        border-color: var(--dark-blue);
        box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
      }

      .input-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 14px;
        z-index: 1;
      }

      input {
        width: 100%;
        padding: 10px 44px 10px 38px;
        font-size: 14px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: #000000;
        outline: none;
        flex: 1;
        min-height: 44px;
      }

      input::placeholder {
        color: #9ca3af;
      }

      .password-toggle {
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        font-size: 18px;
        padding: 8px 10px;
        transition: var(--transition-smooth);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        line-height: 1;
      }

      .password-toggle:hover {
        color: var(--dark-blue);
      }

      /* Requirements */
      .requirements {
        background: var(--dark-blue-bg);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        margin: 12px 0;
        border: 1px solid var(--card-border);
      }

      .requirements p {
        font-size: 12px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 8px;
      }

      .requirement-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #000000;
        margin-bottom: 4px;
      }

      .requirement-item:last-child {
        margin-bottom: 0;
      }

      .requirement-item i {
        font-size: 12px;
        width: 16px;
      }

      .requirement-item.valid i {
        color: var(--success);
      }

      .requirement-item.invalid i {
        color: #9ca3af;
      }

      /* Buttons - SAME ROW ON ALL SCREENS */
      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .btn-submit {
        flex: 1;
        padding: 10px 16px;
        background: var(--dark-blue);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
        white-space: nowrap;
        text-align: center;
      }

      .btn-submit:hover {
        background: var(--dark-blue-light);
        transform: translateY(-2px);
      }

      .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-cancel {
        flex: 1;
        padding: 10px 16px;
        background: #f3f4f6;
        color: var(--text-gray);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition-smooth);
        text-decoration: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .btn-cancel:hover {
        background: #e5e7eb;
      }

      /* Small screens - buttons stay side by side */
      @media (max-width: 480px) {
        .form-actions {
          gap: 8px;
        }
        .btn-submit {
          font-size: 12px;
          padding: 8px 10px;
          flex: 1;
        }
        .btn-cancel {
          font-size: 12px;
          padding: 8px 10px;
          flex: 1;
        }
        .input-icon {
          font-size: 13px;
          left: 10px;
        }
        input {
          padding: 8px 38px 8px 34px;
          font-size: 13px;
          min-height: 38px;
        }
        .password-toggle {
          font-size: 15px;
          padding: 6px 8px;
          right: 2px;
        }
      }

      @media (max-width: 360px) {
        .btn-submit {
          font-size: 10px;
          padding: 6px 8px;
        }
        .btn-cancel {
          font-size: 10px;
          padding: 6px 8px;
        }
        .form-actions {
          gap: 4px;
        }
        .input-icon {
          font-size: 11px;
          left: 8px;
        }
        input {
          padding: 6px 32px 6px 28px;
          font-size: 11px;
          min-height: 32px;
        }
        .password-toggle {
          font-size: 12px;
          padding: 4px 6px;
          right: 1px;
        }
      }

      /* Message */
      .message {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        display: none;
        text-align: center;
      }

      .message.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
        border-left: 4px solid var(--success);
      }

      .message.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
        border-left: 4px solid var(--error);
      }

      /* ===== FOOTER ===== */
      .main-footer {
        background: #ffffff;
        border-top: 1px solid var(--card-border);
        padding: 8px 0 10px;
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 100;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
        flex-shrink: 0;
      }

      .nav-icons {
        display: flex;
        justify-content: space-around;
        align-items: center;
        max-width: 400px;
        margin: 0 auto;
        padding: 0 12px;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #000000;
        padding: 4px 10px;
        transition: var(--transition-smooth);
        font-size: 13px;
        cursor: pointer;
        position: relative;
        min-width: 56px;
        background: none;
        border: none;
        font-weight: 400 !important;
        border-radius: 12px;
      }

      .nav-item i {
        font-size: 28px;
        margin-bottom: 3px;
        color: #000000;
        transition: var(--transition-smooth);
      }

      .nav-item span {
        font-size: 15px;
        font-weight: 400 !important;
        color: #000000;
        letter-spacing: 0.2px;
        transition: var(--transition-smooth);
      }

      .nav-item:hover {
        color: var(--dark-blue);
        transform: translateY(-3px);
        background: var(--dark-blue-bg);
      }

      .nav-item:hover i {
        color: var(--dark-blue);
        transform: scale(1.15);
      }

      .nav-item:hover span {
        color: var(--dark-blue);
      }

      @media (max-width: 600px) {
        .nav-item {
          min-width: 44px;
          padding: 4px 6px;
        }
        .nav-item i {
          font-size: 24px;
        }
        .nav-item span {
          font-size: 13px;
        }
        .nav-icons {
          gap: 2px;
          padding: 0 6px;
          max-width: 100%;
        }
      }
      @media (max-width: 400px) {
        .nav-item {
          min-width: 38px;
          padding: 4px 4px;
        }
        .nav-item i {
          font-size: 22px;
        }
        .nav-item span {
          font-size: 12px;
        }
      }

      @media print {
        .main-header,
        .main-footer {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-left">
        <a href="menu.html" class="hamburger-link" aria-label="Menu">
          <i class="fas fa-bars"></i>
        </a>
      </div>
      <div class="header-center">
        <span class="page-title">Change Password</span>
      </div>
      <div class="header-right">
        <button
          class="icon-btn"
          title="Notifications"
          onclick="alert('Notifications coming soon!')"
        >
          <i class="fas fa-bell"></i>
        </button>
        <a
          href="profile.html"
          class="avatar-btn"
          title="Profile"
          id="avatarBtn"
        >
          <img id="profileAvatar" src="default-avatar.png" alt="Profile" />
          <span class="avatar-initials" id="avatarInitials">U</span>
        </a>
      </div>
    </header>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scrollable-content">
      <div class="container">
        <div class="page-header">
          <h2>Change Password</h2>
        </div>

        <div class="form-card">
          <form id="passwordForm" novalidate>
            <!-- Current Password -->
            <div class="form-group">
              <label>Current Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="currentPassword"
                  placeholder="Enter current password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('currentPassword', this)"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- New Password -->
            <div class="form-group">
              <label>New Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock-open input-icon"></i>
                <input
                  type="password"
                  id="newPassword"
                  placeholder="Enter new password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('newPassword', this)"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label>Confirm Password</label>
              <div class="input-wrapper">
                <i class="fas fa-check-circle input-icon"></i>
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Confirm new password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('confirmPassword', this)"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <!-- Password Requirements -->
            <div class="requirements">
              <p>Password must:</p>
              <div class="requirement-item" id="reqLength">
                <i class="fas fa-circle"></i>
                <span>Be at least 8 characters</span>
              </div>
              <div class="requirement-item" id="reqMatch">
                <i class="fas fa-circle"></i>
                <span>Match confirmation password</span>
              </div>
            </div>

            <!-- Buttons - SAME ROW -->
            <div class="form-actions">
              <button type="submit" class="btn-submit" id="changePasswordBtn">
                Save
              </button>
              <a href="settings.html" class="btn-cancel">Cancel</a>
            </div>

            <!-- Message -->
            <div id="message" class="message"></div>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer class="main-footer">
      <div class="nav-icons">
        <a href="new sales form.html" class="nav-item"
          ><i class="fas fa-cash-register"></i><span>Add Sale</span></a
        >
        <a href="profit report.html" class="nav-item"
          ><i class="fas fa-chart-line"></i><span>Profit</span></a
        >
        <a href="settings.html" class="nav-item"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>
    </footer>

    <script>
      function loadUserAvatar() {
        const avatarImg = document.getElementById("profileAvatar");
        const initialsSpan = document.getElementById("avatarInitials");
        const user = JSON.parse(localStorage.getItem("currentUser") || "{}");
        const name = user.name || "User";
        const nameParts = name.trim().split(" ");
        let initials =
          nameParts.length >= 2
            ? (nameParts[0].charAt(0) + nameParts[1].charAt(0)).toUpperCase()
            : nameParts[0].charAt(0).toUpperCase();
        if (!initials) initials = "U";

        let hasImage = false,
          imageSrc = null;
        if (user.profileImage) {
          imageSrc = user.profileImage;
          hasImage = true;
        }
        if (hasImage && imageSrc) {
          avatarImg.src = imageSrc;
          avatarImg.style.display = "block";
          initialsSpan.style.display = "none";
        } else {
          avatarImg.style.display = "none";
          initialsSpan.textContent = initials;
          initialsSpan.style.display = "flex";
          initialsSpan.style.background = "var(--card-bg)";
          initialsSpan.style.color = "#000000";
        }
      }

      function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const currentUser = localStorage.getItem("currentUser");
        if (!isLoggedIn || isLoggedIn !== "true" || !currentUser) {
          window.location.href = "index.html";
          return null;
        }
        try {
          return JSON.parse(currentUser);
        } catch (e) {
          window.location.href = "index.html";
          return null;
        }
      }

      window.togglePassword = function (inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      };

      const currentPasswordInput = document.getElementById("currentPassword");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const messageDiv = document.getElementById("message");
      const changePasswordBtn = document.getElementById("changePasswordBtn");
      const passwordForm = document.getElementById("passwordForm");
      const reqLength = document.getElementById("reqLength");
      const reqMatch = document.getElementById("reqMatch");

      let currentUser = null;

      function validatePassword() {
        const newPass = newPasswordInput.value;
        const confirmPass = confirmPasswordInput.value;
        let isValid = true;

        if (newPass.length >= 8) {
          reqLength.classList.add("valid");
          reqLength.classList.remove("invalid");
          reqLength.querySelector("i").className = "fas fa-check-circle";
        } else {
          reqLength.classList.add("invalid");
          reqLength.classList.remove("valid");
          reqLength.querySelector("i").className = "fas fa-circle";
          isValid = false;
        }

        if (newPass === confirmPass && newPass.length > 0) {
          reqMatch.classList.add("valid");
          reqMatch.classList.remove("invalid");
          reqMatch.querySelector("i").className = "fas fa-check-circle";
        } else {
          reqMatch.classList.add("invalid");
          reqMatch.classList.remove("valid");
          reqMatch.querySelector("i").className = "fas fa-circle";
          isValid = false;
        }

        return isValid;
      }

      function showMessage(text, isSuccess = true) {
        messageDiv.textContent = text;
        messageDiv.className = isSuccess ? "message success" : "message error";
        clearTimeout(messageDiv._timeout);
        messageDiv._timeout = setTimeout(() => {
          messageDiv.style.display = "none";
          messageDiv.className = "message";
        }, 5000);
      }

      newPasswordInput.addEventListener("input", validatePassword);
      confirmPasswordInput.addEventListener("input", validatePassword);

      passwordForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const currentPass = currentPasswordInput.value.trim();
        const newPass = newPasswordInput.value.trim();
        const confirmPass = confirmPasswordInput.value.trim();

        if (!currentPass || !newPass || !confirmPass) {
          showMessage("All fields are required.", false);
          return;
        }

        if (!validatePassword()) {
          showMessage("Please meet all password requirements.", false);
          return;
        }

        changePasswordBtn.disabled = true;
        changePasswordBtn.textContent = "Saving...";

        try {
          await Optra.changePassword({
            currentPassword: currentPass,
            newPassword: newPass,
          });
          showMessage("Password updated successfully!", true);
          currentPasswordInput.value = "";
          newPasswordInput.value = "";
          confirmPasswordInput.value = "";
          reqLength.classList.remove("valid", "invalid");
          reqMatch.classList.remove("valid", "invalid");
          reqLength.querySelector("i").className = "fas fa-circle";
          reqMatch.querySelector("i").className = "fas fa-circle";
        } catch (error) {
          const msg =
            (error.data && error.data.error) ||
            error.message ||
            "An error occurred. Please try again.";
          showMessage(msg, false);
        } finally {
          changePasswordBtn.disabled = false;
          changePasswordBtn.textContent = "Save";
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        currentUser = checkAuth();
        if (currentUser) {
          loadUserAvatar();
        }
      });
